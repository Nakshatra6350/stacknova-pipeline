name: film voice

# Look v3 (owner's direction of 21 October 2026): speaks the dialogue of every film in studio/films
# whose lines changed, in the owner's cloned voice, and stores the WAVs only in the draft Release
# look-v3-draft as film-<id>-voice-<digest>.zip. Publishes nothing. Re-runs are safe: a film whose
# voice is already stored for the same lines is skipped.
#
# A long film would take hours in one job, so each film is split into chunks of lines (plan), the
# chunks are spoken in parallel jobs (speak: each stores chunk-<id>-<digest>-<n>.zip in the draft
# Release), and the last job puts each film's chunks back together and removes them (store).
# When a film already has a stored voice for an earlier version, only its new or changed lines are
# spoken; the store job takes the rest from that voice (the matrix's `base`).
on:
  push:
    branches: [look-v3]
    paths:
      - studio/films/*/film.yaml
      - studio/scripts/film_voice.py
      - .github/workflows/film-voice.yml

permissions:
  contents: write # creates and updates the draft Release that stores the voices

concurrency:
  group: film-voice
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  HF_HUB_DISABLE_TELEMETRY: "1"
  TQDM_DISABLE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the plan reads earlier versions of film.yaml to reuse unchanged lines
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: List the chunks to speak
        id: plan
        run: |
          set -euo pipefail
          uv sync --locked --no-default-groups
          gh release view look-v3-draft >/dev/null 2>&1 || gh release create look-v3-draft \
            --draft --title "Look v3 draft renders" \
            --notes "Private storage for the look v3 drafts. This Release stays a draft."
          gh release view look-v3-draft --json assets --jq '.assets[].name' > "$RUNNER_TEMP/stored.txt"
          matrix="$(uv run --no-sync python studio/scripts/film_voice.py --plan "$RUNNER_TEMP/stored.txt")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "$matrix"

  speak:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Install voice dependencies
        run: uv sync --locked --no-default-groups --group voice
      - name: Restore model weights (public files, safe to cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-${{ hashFiles('uv.lock') }}-default
          restore-keys: |
            hf-chatterbox-${{ hashFiles('uv.lock') }}-
            hf-chatterbox-
      # curl, not `gh api`: gh fails on binary bodies ("transform: short source buffer").
      - name: Fetch the voice reference
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${CONTENT_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RUNNER_TEMP/reference.wav" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/stacknova-content/contents/voice/reference.wav"
          test "$(head -c 4 "$RUNNER_TEMP/reference.wav")" = "RIFF"
      - name: Speak ${{ matrix.film }} chunk ${{ matrix.chunk }}
        env:
          FILM: ${{ matrix.film }}
          CHUNK: ${{ matrix.chunk }}
          IDS: ${{ matrix.ids }}
        run: |
          set -euo pipefail
          film="studio/films/$FILM/film.yaml"
          digest="$(uv run --no-sync python studio/scripts/film_voice.py --digest "$film")"
          uv run --no-sync python studio/scripts/film_voice.py "$film" "$RUNNER_TEMP/reference.wav" "$RUNNER_TEMP/out" --only "$IDS"
          (cd "$RUNNER_TEMP/out" && zip -qr "$RUNNER_TEMP/chunk-$FILM-$digest-$CHUNK.zip" . -x 'cache/*')
          gh release upload look-v3-draft "$RUNNER_TEMP/chunk-$FILM-$digest-$CHUNK.zip" --clobber

  store:
    needs: [plan, speak]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Put each film's chunks together and store its voice
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          uv sync --locked --no-default-groups
          for id in $(echo "$MATRIX" | jq -r '.[].film' | sort -u); do
            film="studio/films/$id/film.yaml"
            digest="$(uv run --no-sync python studio/scripts/film_voice.py --digest "$film")"
            name="$(uv run --no-sync python studio/scripts/film_voice.py --name "$film")"
            work="$RUNNER_TEMP/$id"
            mkdir -p "$work/chunks" "$work/out"
            gh release download look-v3-draft -p "chunk-$id-$digest-*.zip" -D "$work"
            for zip in "$work"/chunk-*.zip; do
              unzip -q "$zip" -d "$work/chunks/$(basename "$zip" .zip)"
            done
            # the lines that did not change come from the film's stored voice ("0-base" merges first)
            base="$(echo "$MATRIX" | jq -r --arg id "$id" '[.[] | select(.film == $id)][0].base // ""')"
            if [ -n "$base" ]; then
              gh release download look-v3-draft -p "$base" -D "$work"
              unzip -q "$work/$base" -d "$work/chunks/0-base"
            fi
            uv run --no-sync python studio/scripts/film_voice.py --merge "$film" "$work/chunks" "$work/out"
            (cd "$work/out" && zip -qr "$RUNNER_TEMP/$name" .)
            gh release upload look-v3-draft "$RUNNER_TEMP/$name" --clobber
            for zip in "$work"/chunk-*.zip; do
              gh release delete-asset look-v3-draft "$(basename "$zip")" --yes
            done
          done
