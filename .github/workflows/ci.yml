name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests, episodes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so pin the release commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install ffmpeg (the audio tests run it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Types
        run: uv run mypy src
      - name: Tests
        run: uv run pytest
      - name: Validate every episode
        run: uv run python -m channel_os.validate content/episodes/*/episode.yaml

  # The page tests draw real frames in a headless browser: their own job, with the scenes
  # group. The check job skips them, because it has no browser driver.
  scenes:
    name: scene page tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Install
        run: uv sync --locked --group scenes
      # Scenes are drawn in the Chrome the runner image ships; nothing is downloaded.
      - name: Show the browser
        run: google-chrome --version
      - name: Page tests
        run: >-
          uv run --group scenes pytest tests/test_page.py tests/test_page_stages.py
          tests/test_preview.py tests/test_sound.py

  samples:
    name: code samples compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Compile every Java sample
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r dir; do
            echo "::group::$dir"
            mapfile -t sources < <(find "$dir" -name '*.java')
            javac --release 25 -d "$RUNNER_TEMP/classes/$count" "${sources[@]}"
            echo "::endgroup::"
            count=$((count + 1))
          done < <(find content/episodes -type d -path '*/samples/java')
          echo "compiled $count Java sample folder(s)"
      - name: Vet and build every Go sample
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            echo "::group::$dir"
            # tidy writes go.sum for samples that use a library (go.sum is not committed:
            # the owner's machine has an older Go than the libraries need).
            (cd "$dir" && go mod tidy && go vet ./... && go build ./... \
              && test -z "$(gofmt -l .)")
            echo "::endgroup::"
            count=$((count + 1))
          done < <(find content/episodes -name go.mod)
          echo "checked $count Go module(s)"
