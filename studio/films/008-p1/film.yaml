# Postgres MVCC, part 1 of 4: readers never wait. A quick Short leading into episode 008
# (Saturday 31 October 2026).
#
# Facts, PostgreSQL 18 (docs: 13.1 Introduction, 5.6 System Columns, 13.2 Transaction Isolation):
#   each statement sees a snapshot of the data; "reading never blocks writing and writing never
#   blocks reading"; an UPDATE writes a new row version, the old one stays; xmin is the transaction
#   that inserted a row version; at Read Committed (the default) a statement sees only data
#   committed before it began, so others see the old version until the update commits
id: 008-p1
format: short
world: mvcc
title: POSTGRES MVCC
episode: EP 008 · PART 1
steps: ["WAIT?", NEW VERSION, SNAPSHOT, NO WAITING, COMMIT]
end: {kicker: PART 2, head: "UPDATE is really\nINSERT + DELETE", cta: part 2}

lines:
  - id: n1
    who: nova
    say: "I'm updating Ana's balance. Shouldn't every reader have to wait until I'm done?"
  - id: e1
    who: engineer
    say: "Not in Postgres. Your update doesn't change the row. It writes a new version of it."
  - id: n2
    who: nova
    say: "A new version? Then which one does a reader see?"
  - id: e2
    who: engineer
    say: "The one its snapshot allows. Every row version carries the ID of the transaction that wrote it."
  - id: e3
    who: engineer
    say: "Yours hasn't committed yet, so everyone else still reads the old version, with the old balance."
  - id: n3
    who: nova
    say: "So nobody waits for me?"
  - id: e4
    who: engineer
    say: "Readers never block writers, and writers never block readers. That's MVCC: multi-version concurrency control."
  - id: n4
    who: nova
    say: "And when I commit?"
  - id: e5
    who: engineer
    say: "New snapshots see your version. The old one stays behind for a while. Part two: where it goes."
    show: "New snapshots see your version. The old one stays behind for a while. Part 2: where it goes."

hook: "WHO WAITS FOR AN UPDATE?"
events:
  version: e1.writes
  commit: n4.commit

sfx:
  - {at: n1.updating, sound: tick, gain: 0.5}
  - {at: e1-0.6, sound: vision, gain: 0.6}
  - {at: version, sound: pop, gain: 0.7}
  - {at: e3.reads, sound: whip, gain: 0.5}
  - {at: e4.mvcc, sound: ding, gain: 0.5}
  - {at: commit+0.2, sound: arp, gain: 0.6}

props:
  tx: {kind: label, text: "TX 105", sub: "UPDATE accounts · running", tone: amber}
  done: {kind: label, text: "TX 105", sub: "committed", tone: green}
  read: {kind: key, text: "SELECT balance", tone: cyan}
  sees: {kind: label, text: "$100", sub: "the old version: no waiting", tone: cyan}
  mvcc: {kind: label, text: "MVCC", sub: "multi-version concurrency control", tone: cyan, size: 1.3}

beats:
  - at: -1
    shot: {kind: look, at: "bucket:0", dist: 3.4, height: 0.5, angle: 22}
    hud: {step: 0}
    nova: {to: "front:1:1.1:1.55", dur: 0.01, face: normal, look: "slot:0:0"}
    world:
      - {put: "$100 · xmin 100#a1", bucket: 0, tone: cyan}
      - {put: "$250 · xmin 98#b1", bucket: 1, tone: cyan}
      - {put: "$40 · xmin 99#c1", bucket: 2, tone: cyan}
      - {put: "$900 · xmin 97#d1", bucket: 3, tone: cyan}
      - {put: "$15 · xmin 101#e1", bucket: 4, tone: cyan}
  - at: n1.updating-0.3
    prop: {id: tx, place: "front:0:1.0:2.25"}
    world: {bucket: 0, tone: active}
  - at: n1.wait
    nova: {face: confused}
  # the update writes a new version
  - at: e1-0.9
    shot: {kind: engineer, side: 0.4}
    engineer: {enter: true, face: calm}
    nova: {to: nova.home, dur: 1.0}
  - at: e1.writes-0.4
    shot: {kind: look, at: "bucket:0", dist: 2.3, height: 0.35, angle: -8}
    world: {put: "$70 · xmin 105#a2", bucket: 0, from: "top:0", dur: 0.45, tone: amber}
    hud: {step: 1, callout: "A NEW VERSION", tone: amber, for: 1.6}
  - at: n2
    shot: {kind: nova, side: -0.4}
    nova: {face: confused}
  # its snapshot decides
  - at: e2
    shot: {kind: look, at: "slot:0:0", dist: 1.7, height: 0.2, angle: 6}
    hud: {step: 2}
  - at: e2.carries
    hud: {callout: "xmin = WHO WROTE IT", tone: cyan, for: 2.2}
  - at: e3
    shot: {kind: look, at: "bucket:0", dist: 2.6, height: 0.45, angle: 10}
    world: {key: "$70 · xmin 105#a2", tone: dim}
    prop: {id: read, place: "front:0:1.6:2.5"}
  - at: e3.reads-0.2
    prop: [{id: read, to: "slot:0:0", dur: 0.5, arc: 0.15}]
  - at: e3.old
    prop: [{id: read, hide: true}, {id: sees, place: "front:0:1.0:2.25"}]
  - at: n3
    shot: {kind: nova, side: 0.4}
    prop: [{id: sees, hide: true}, {id: tx, hide: true}]
    nova: {face: happy}
  - at: e4
    shot: {kind: two, side: -0.2}
    hud: {step: 3}
    engineer: {face: smirk}
  - at: e4.mvcc-0.2
    shot: {kind: look, prop: mvcc, dist: 1.7, height: 0.04}
    prop: {id: mvcc, place: [0, 2.45, -0.5]}
  - at: n4
    shot: {kind: look, at: "bucket:0", dist: 2.4, height: 0.4, angle: 8}
    prop: [{id: mvcc, hide: true}, {id: done, place: "front:0:1.0:2.25"}]
    hud: {step: 4}
  - at: commit+0.2
    world:
      - {key: "$70 · xmin 105#a2", tone: green}
      - {relabel: "$100 · xmin 100#a1", text: "$100 · xmin 100 · xmax 105"}
      - {key: "$100 · xmin 100#a1", tone: dead}
  - at: e5
    shot: {kind: engineer, side: -0.3}
    prop: {id: done, hide: true}
    engineer: {face: smile}
  - at: end
    shot: {kind: two, side: 0.2, dist: 2.6}
    nova: {face: celebrate, gesture: wave}
    engineer: {face: smile, gesture: thumbsUp}
    until: end+9
