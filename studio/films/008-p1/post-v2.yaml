caption: |
  Postgres MVCC: why your SELECT never waits for my UPDATE 🐘

  1️⃣ An UPDATE doesn't change the row: it writes a new version
  2️⃣ Every version carries the ID of the transaction that wrote it (xmin)
  3️⃣ Until the update commits, other readers' snapshots still see the old version
  4️⃣ Readers never block writers, writers never block readers: that's MVCC

  The part most people mix up: two writers on the same row still take turns. MVCC removes the waiting between readers and writers.

  Postgres MVCC, part 1 of 4. Part 2 tomorrow: where the old version goes

