caption: |
  One web request. 100% CPU. For hours: a HashMap hash collision attack 🧨

  December 2011: researchers showed that a single crafted request could freeze Java, PHP, Python and Ruby servers.
  1️⃣ The request carried thousands of form fields
  2️⃣ "Aa" and "BB" share one hashCode (2112), and so does every combination of them
  3️⃣ Every field lands in the same HashMap bucket: one giant chain
  4️⃣ Each insert walks the whole chain: twice the fields, four times the work

  The fix came in two parts: servers capped how many parameters a request may carry, and Java 8 turned a crowded bucket into a red-black tree.

  The full HashMap deep dive is on YouTube: @StackNovaDev

