cover: {t: 35.0, title: "Deleted. Still growing.", series: "Postgres MVCC, part 3 of 4", part: 3, of: 4}
caption: |
  Deleting rows won't shrink your Postgres table. One idle transaction can keep it growing 📈

  1️⃣ Deleted rows become dead versions, waiting for VACUUM
  2️⃣ VACUUM only removes versions no open transaction can still see
  3️⃣ A session that began a transaction an hour ago and went idle keeps its snapshot open
  4️⃣ Every version that snapshot might need stays: the table bloats, and every scan wades through dead rows

  The fix: look in pg_stat_activity for sessions idle in transaction, and set idle_in_transaction_session_timeout so Postgres ends them for you.

  Postgres MVCC, part 3 of 4. The full deep dive is on YouTube tomorrow

