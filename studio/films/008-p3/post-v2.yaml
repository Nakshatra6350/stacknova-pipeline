description: |
  Postgres VACUUM and table bloat, explained: deleted rows stay as dead versions until no open snapshot can need them, so one session left idle in a transaction holds up VACUUM for the whole table. Find it in pg_stat_activity (state = 'idle in transaction') and set idle_in_transaction_session_timeout so Postgres ends it for you.

  Postgres MVCC, part 3 of 4. Next: the day a database stopped accepting writes. The full deep dive is out Saturday 31 October.

