name: Postgres MVCC part 3
title: "One Idle Transaction Can Bloat Your Postgres Table #Shorts"
description: |
  Deleted rows stay as dead versions until no open snapshot can need them. One session idle in a transaction holds up VACUUM. Find it in pg_stat_activity, and set idle_in_transaction_session_timeout.

  Part 3 of 4. The full Postgres MVCC deep dive is out Saturday 31 October.

  #Shorts #postgresql #database #backenddeveloper #systemdesign
caption: |
  We delete old orders every night. The table keeps growing. 📈

  1️⃣ Deleted rows become dead versions, waiting for VACUUM
  2️⃣ VACUUM only removes versions no open transaction can still see
  3️⃣ A session that began a transaction an hour ago and went idle keeps its snapshot open
  4️⃣ Every version it might need stays: the table bloats, and every scan wades through dead rows

  The fix: look in pg_stat_activity for sessions idle in transaction, and set idle_in_transaction_session_timeout so Postgres ends them for you.

  Part 4: the day a database stopped accepting writes
