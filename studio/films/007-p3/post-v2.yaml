description: |
  Why does HashMap get() return null for a key you just put? If a field used by hashCode() changes after you put the key, HashMap looks in the wrong bucket: get(), containsKey() and remove() all miss an entry that is still in the map. A quiet memory leak. The fix: immutable keys, like a String or a record.

  Java HashMap internals, part 3 of 4. Next: why new HashMap<>(100) isn't room for 100. The full deep dive is out Tuesday 27 October.

