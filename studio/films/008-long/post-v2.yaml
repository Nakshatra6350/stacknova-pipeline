# The 22 Oct 2026 reach plan for the Postgres MVCC deep dive (Saturday 31 October): the kit's titles
# and the description's opening paragraph, led by what people type ("postgres mvcc", "how mvcc works
# in postgresql", "postgres vacuum"). The rest of the kit (chapters, sources, tags) stays as it is.
name: Postgres MVCC deep dive
titles:
  - "How Postgres MVCC Works (xmin, xmax, VACUUM, Wraparound)"
  - "Postgres MVCC Explained: Why Readers Never Wait"
  - "PostgreSQL MVCC Deep Dive: Snapshots to Wraparound, in Go"
  - "Postgres VACUUM and Table Bloat: MVCC, Line by Line"
lead: |
  How Postgres MVCC works, from row versions to the outage it can cause: xmin and xmax, snapshots
  and visibility, Read Committed vs Repeatable Read, dead rows and VACUUM, the idle transaction
  that bloats a table, transaction ID wraparound and freezing (the 2019 Mandrill outage). Then the
  trade-offs, each with its fix in code: a withdrawal that retries on error 40001, the query that
  measures HOT updates, and a connection pool that ends forgotten transactions. Seven walkthroughs
  of real code (Go with pgx, and SQL), line by line.
hashtags: "#postgresql #database #golang"
