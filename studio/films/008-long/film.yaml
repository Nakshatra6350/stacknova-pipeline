# Episode 008, the long video: how Postgres lets readers and writers work at the same time
# (MVCC), told by the engineer and Nova in the row vault (the mvcc world: five rows, each slab a
# row version). Out Saturday 31 October 2026. Packaging, sources and the fact check are in
# content/episodes/008-postgres-mvcc/episode.yaml; the walkthroughs show its samples/go.
id: 008-long
format: long
world: mvcc
title: POSTGRES MVCC
episode: EP 008
steps: [NO WRITES, "ONE COPY?", VERSIONS, SNAPSHOTS, VACUUM, WRAPAROUND, COSTS]
end: {kicker: "NEXT · TUESDAY", head: "A new deep dive,\ntwice a week", cta: next}
music: 0.32

lines:
  # s01 hook: the database that refused every write
  - id: e1
    who: engineer
    segment: s01
    say: "February 2019. An email service stopped sending for nearly two days. The database wasn't down. It simply refused every write."
  - id: n1
    who: nova
    say: "Refused? A healthy database?"
  - id: e2
    who: engineer
    say: "Healthy, and protecting itself. And the fix it asked for was estimated to take forty days."
    show: "Healthy, and protecting itself. And the fix it asked for was estimated to take 40 days."
  - id: n2
    who: nova
    say: "Forty days?! What could do that?"
    show: "40 days?! What could do that?"
  - id: e3
    who: engineer
    say: "The same machinery that lets Postgres read and write at the same time. Let's open it up."
  - id: w1
    who: engineer
    speed: 1.15
    after: 0.6
    say: "Every digital frontier begins with an idea. What brings it to life is the engineering beneath it. Welcome to StackNova, exploring the architecture of tomorrow, one system at a time."
    show: "Every digital frontier begins with an idea. What brings it to life is the engineering beneath it. Welcome to StackNova — exploring the architecture of tomorrow, one system at a time."

  # s02 the naive model: one copy and a lock
  - id: n3
    who: nova
    segment: s02
    say: "I'd guess Postgres keeps one copy of each row, and locks it while someone changes it."
  - id: e4
    who: engineer
    say: "That's what most people picture. A writer locks the row, and every reader waits."
  - id: e5
    who: engineer
    say: "Then a long report would freeze every checkout, and every checkout would freeze the report."
  - id: n4
    who: nova
    say: "So what does it do instead?"
  - id: e6
    who: engineer
    say: "It keeps more than one version of a row, and lets each reader see the right one."

  # s03 versions: a read that does not wait (walkthrough 1)
  - id: e7
    who: engineer
    segment: s03
    say: "Here's the proof, in Go, with the p g x driver."
    show: "Here's the proof, in Go, with the pgx driver."
  - id: e8
    who: engineer
    say: "Line one opens a transaction: the writer. Line two changes Ana's balance from a hundred to seventy. It isn't committed yet."
    show: "Line 1 opens a transaction: the writer. Line 2 changes Ana's balance from 100 to 70. It isn't committed yet."
  - id: e9
    who: engineer
    say: "Line four reads the same row on another connection. It doesn't wait. It gets a hundred: the old version."
    show: "Line 4 reads the same row on another connection. It doesn't wait. It gets 100: the old version."
  - id: e10
    who: engineer
    say: "Line six commits. And line seven reads again: seventy. A new statement, a new snapshot."
    show: "Line 6 commits. And line 7 reads again: 70. A new statement, a new snapshot."
  - id: n5
    who: nova
    say: "Two versions of the same row, at the same time?"
  - id: e11
    who: engineer
    say: "Exactly. The update didn't change the row. It wrote a new version, and left the old one for anyone still looking."
  - id: n5a
    who: nova
    say: "Where does the old version live?"
  - id: e11a
    who: engineer
    say: "Right beside the new one, in the same table. Some databases, like MySQL's InnoDB, move old versions to an undo log instead. Postgres keeps them in place."

  # s04 snapshots and visibility (walkthrough 2)
  - id: e12
    who: engineer
    segment: s04
    say: "Every version carries two stamps. X min: the transaction that wrote it. X max: the transaction that replaced or deleted it."
    show: "Every version carries two stamps. xmin: the transaction that wrote it. xmax: the transaction that replaced or deleted it."
  - id: e13
    who: engineer
    say: "A snapshot says which transactions a statement may see. A version is visible when its x min committed before the snapshot, and its x max didn't."
    show: "A snapshot says which transactions a statement may see. A version is visible when its xmin committed before the snapshot, and its xmax didn't."
  - id: e13a
    who: engineer
    say: "Postgres stores a snapshot as a range of transaction IDs, plus the ones still running when it was taken. Anything still running is invisible, even if it commits a moment later."
  - id: e14
    who: engineer
    say: "At read committed, the default, every statement takes a new snapshot. At repeatable read, the whole transaction keeps its first one."
    show: "At Read Committed, the default, every statement takes a new snapshot. At Repeatable Read, the whole transaction keeps its first one."
  - id: e14a
    who: engineer
    say: "So a report at repeatable read sees every balance as of its first query, even if hundreds of payments commit while it runs."
    show: "So a report at Repeatable Read sees every balance as of its first query, even if hundreds of payments commit while it runs."
  - id: n6
    who: nova
    say: "Can I see those stamps?"
  - id: e15
    who: engineer
    say: "Ask for them. This query selects x min, x max, and c t i d: where the version sits on disk."
    show: "Ask for them. This query selects xmin, xmax, and ctid: where the version sits on disk."
  - id: e16
    who: engineer
    say: "Run it, update the row, and run it again. A new x min, and a new c t i d. The old version is still on the page, just not visible to you."
    show: "Run it, update the row, and run it again. A new xmin, and a new ctid. The old version is still on the page, just not visible to you."

  # s05 dead versions, VACUUM and the idle transaction (walkthrough 3)
  - id: n7
    who: nova
    segment: s05
    say: "And the old versions? Do they stay forever?"
  - id: e17
    who: engineer
    say: "Until no snapshot can see them. Then they're dead, and vacuum takes the space back. Autovacuum does it for you, table by table."
    show: "Until no snapshot can see them. Then they're dead, and VACUUM takes the space back. Autovacuum does it for you, table by table."
  - id: e17a
    who: engineer
    say: "It wakes up when enough rows have died: by default, fifty, plus a fifth of the table. And it doesn't shrink the file. It marks the space free for new rows. Vacuum full rewrites the table smaller, but it locks the table while it does."
    show: "It wakes up when enough rows have died: by default, 50, plus a fifth of the table. And it doesn't shrink the file. It marks the space free for new rows. VACUUM FULL rewrites the table smaller, but it locks the table while it does."
  - id: e18
    who: engineer
    say: "But one open transaction can hold all of it back. If a session starts a transaction and goes idle, its snapshot stays open."
  - id: e19
    who: engineer
    say: "Every version it might still need has to stay. The table bloats, and scans wade through dead rows."
  - id: e19a
    who: engineer
    say: "Old replication slots and forgotten prepared transactions hold cleanup back the same way."
  - id: e20
    who: engineer
    say: "So look for it. This query lists the sessions that are idle inside a transaction."
  - id: e21
    who: engineer
    say: "Line three turns how long the transaction has been open into seconds. Line five keeps only the idle ones. And Postgres can end them for you: set idle in transaction session timeout."
    show: "Line 3 turns how long the transaction has been open into seconds. Line 5 keeps only the idle ones. And Postgres can end them for you: set idle_in_transaction_session_timeout."
  - id: n7a
    who: nova
    say: "And if I need the disk space back right away?"
  - id: e21a
    who: engineer
    say: "Then schedule vacuum full for a quiet moment. It blocks every read and write on that table until it's done."
    show: "Then schedule VACUUM FULL for a quiet moment. It blocks every read and write on that table until it's done."

  # s06 wraparound: the Mandrill outage (walkthrough 4)
  - id: e22
    who: engineer
    segment: s06
    say: "Vacuum has a second job, and that's where the outage came from."
    show: "VACUUM has a second job, and that's where the outage came from."
  - id: e23
    who: engineer
    say: "Transaction IDs are thirty-two bits. Postgres compares them on a circle: about two billion in the past, two billion in the future."
    show: "Transaction IDs are 32 bits. Postgres compares them on a circle: about 2 billion in the past, 2 billion in the future."
  - id: e24
    who: engineer
    say: "Before the counter comes back around, every old row must be frozen: marked older than everything. Vacuum does that too."
    show: "Before the counter comes back around, every old row must be frozen: marked older than everything. VACUUM does that too."
  - id: e24a
    who: engineer
    say: "Autovacuum forces a freezing pass on any table whose oldest unfrozen ID is two hundred million transactions old. That's the default, and it leaves plenty of room."
    show: "Autovacuum forces a freezing pass on any table whose oldest unfrozen ID is 200 million transactions old. That's the default, and it leaves plenty of room."
  - id: n8
    who: nova
    say: "And if vacuum falls behind?"
    show: "And if VACUUM falls behind?"
  - id: e25
    who: engineer
    say: "Postgres warns you. Then, three million IDs before the edge, it stops starting any transaction that writes."
    show: "Postgres warns you. Then, 3 million IDs before the edge, it stops starting any transaction that writes."
  - id: n8a
    who: nova
    say: "Can't it just use bigger IDs?"
  - id: e25a
    who: engineer
    say: "Not today. Every row version stores its IDs in thirty-two bits, so freezing is the way out, and your monitoring is the safety net."
    show: "Not today. Every row version stores its IDs in 32 bits, so freezing is the way out, and your monitoring is the safety net."
  - id: e26
    who: engineer
    say: "That's what hit Mailchimp's Mandrill on February the fourth, 2019. One shard was busier than the rest, and its autovacuum fell behind, or failed."
    show: "That's what hit Mailchimp's Mandrill on 4 February 2019. One shard was busier than the rest, and its autovacuum fell behind, or failed."
  - id: e27
    who: engineer
    say: "A full vacuum was estimated at up to forty days. So they emptied two huge tables to free the IDs, and the vacuum finished in about an hour."
    show: "A full VACUUM was estimated at up to 40 days. So they emptied two huge tables to free the IDs, and the vacuum finished in about an hour."
  - id: e28
    who: engineer
    say: "Sending was impaired for about forty hours. Sentry hit the same wall in July 2015. Both added alerts afterwards. Here's yours."
    show: "Sending was impaired for about 40 hours. Sentry hit the same wall in July 2015. Both added alerts afterwards. Here's yours."
  - id: e29
    who: engineer
    say: "Line two asks every database for the age of its oldest unfrozen transaction ID. Line five raises the alarm at your limit, say a billion, long before the edge."
    show: "Line 2 asks every database for the age of its oldest unfrozen transaction ID. Line 5 raises the alarm at your limit, say a billion, long before the edge."

  # s07 trade-offs
  - id: n9
    who: nova
    segment: s07
    say: "So MVCC is free speed?"
  - id: e30
    who: engineer
    say: "It's a trade. Readers never block writers, and writers never block readers. Every statement sees a consistent snapshot."
  - id: e30a
    who: engineer
    say: "One thing it doesn't remove: two writers changing the same row still take turns. The second waits for the first to commit or roll back."
  - id: g1
    who: engineer
    say: "Here's what that means in code. This withdrawal runs at repeatable read: line one. Lines four and five read the balance and check it."
  - id: g2
    who: engineer
    say: "Line six writes the new balance. If another withdrawal committed first, Postgres refuses this write with error four zero zero zero one."
    show: "Line six writes the new balance. If another withdrawal committed first, Postgres refuses this write with error 40001."
  - id: g3
    who: nova
    say: "So the second withdrawal just fails?"
  - id: g4
    who: engineer
    say: "Nothing was written, so line nine sends it round the loop, and it runs again on a fresh snapshot. Up to three tries."
  - id: g4a
    who: engineer
    say: "Run the same code at read committed instead, and both withdrawals can read a hundred and both write seventy. One withdrawal silently vanishes."
  - id: e31
    who: engineer
    say: "The cost: every update writes a whole new version, and usually new index entries too. Dead versions take space until vacuum runs."
    show: "The cost: every update writes a whole new version, and usually new index entries too. Dead versions take space until VACUUM runs."
  - id: e32
    who: engineer
    say: "Postgres softens that with heap-only tuples. When no indexed column changes and the page has room, the indexes don't need a new entry."
  - id: g5
    who: engineer
    say: "So measure it. This query divides a table's HOT updates by all its updates. Line two is the percentage."
  - id: g6
    who: engineer
    say: "If it's low on a busy table, line seven leaves a tenth of every new page free, so the next version fits on the same page."
  - id: e33
    who: engineer
    say: "Your part: keep transactions short, never leave a session idle inside one, and watch vacuum and transaction ID age."
    show: "Your part: keep transactions short, never leave a session idle inside one, and watch VACUUM and transaction ID age."
  - id: g7
    who: engineer
    say: "And let the database enforce it. Lines four and five set two limits on every connection in the pool."
  - id: g8
    who: engineer
    say: "A transaction left idle for a minute is ended, and its snapshot with it. A statement running past thirty seconds is cancelled. Vacuum never waits on a forgotten session again."

  # s08 recap and next
  - id: e34
    who: engineer
    segment: s08
    say: "Recap. An update writes a new version, stamped with x min and x max. Each statement reads through a snapshot, so readers never wait."
    show: "Recap. An update writes a new version, stamped with xmin and xmax. Each statement reads through a snapshot, so readers never wait."
  - id: e35
    who: engineer
    say: "Vacuum removes versions nobody can see, and freezes old rows before the IDs wrap around. Let it finish, and Postgres never stops."
    show: "VACUUM removes versions nobody can see, and freezes old rows before the IDs wrap around. Let it finish, and Postgres never stops."
  - id: n10
    who: nova
    say: "What's next?"
  - id: e36
    who: engineer
    say: "A new deep dive every Tuesday and Saturday. Follow, so you don't miss it."
  - id: n11
    who: nova
    say: "See you there!"

tail: 12
hook: "THE DATABASE REFUSED EVERY WRITE"
events:
  welcome: w1
  commit: e10.commits
  stamp: e16.update
  vacuum1: e17.vacuum
  bloat: e19.bloats
  wrap: e25.stops
  emptied: e27.emptied

sfx:
  - {at: 0.4, sound: alarm, gain: 0.4}
  - {at: e2.forty, sound: thud, gain: 0.6}
  - {at: welcome-0.4, sound: nod-up, gain: 0.9}
  - {at: e6.keeps-0.2, sound: vision, gain: 0.6}
  - {at: e8.changes, sound: pop, gain: 0.6}
  - {at: e9.reads, sound: whip, gain: 0.5}
  - {at: commit, sound: arp, gain: 0.6}
  - {at: stamp, sound: pop, gain: 0.6}
  - {at: vacuum1, sound: rise, gain: 0.7}
  - {at: bloat, sound: thud, gain: 0.6}
  - {at: e23.circle, sound: rise, gain: 0.6}
  - {at: wrap, sound: alarm, gain: 0.45}
  - {at: emptied, sound: whip, gain: 0.6}
  - {at: e29.line#2, sound: ding, gain: 0.5}

props:
  log:
    kind: code
    file: postgres log
    code: |
      ERROR:  database is not accepting commands that
              assign new transaction IDs to avoid
              wraparound data loss
  forty: {kind: label, text: "40 days", sub: "the estimated fix", tone: red}
  lock: {kind: label, text: "ONE COPY + A LOCK", sub: "readers wait for writers", tone: red}
  w1:
    kind: code
    file: mvcc.go · ReadWhileWriting
    code: |
      w, _ := pool.Begin(ctx)                      // the writer
      w.Exec(ctx, `UPDATE accounts SET balance = 70 WHERE id = 1`)
      q := `SELECT balance FROM accounts WHERE id = 1`
      pool.QueryRow(ctx, q).Scan(&before)          // 100, no wait

      w.Commit(ctx)
      pool.QueryRow(ctx, q).Scan(&after)           // 70
  undo: {kind: label, text: "InnoDB: undo log", sub: "Postgres: old versions stay in the table", tone: cyan}
  snap: {kind: label, text: "xmin : xmax : running", sub: "how Postgres stores a snapshot", tone: cyan}
  rc: {kind: label, text: "READ COMMITTED", sub: "a new snapshot for every statement", tone: cyan}
  rr: {kind: label, text: "REPEATABLE READ", sub: "one snapshot for the whole transaction", tone: amber}
  w2:
    kind: code
    file: mvcc.go · Version
    code: |
      q := `SELECT xmin::text, xmax::text, ctid::text
            FROM accounts WHERE id = 1`
      pool.QueryRow(ctx, q).Scan(&xmin, &xmax, &ctid)
  auto: {kind: label, text: "50 + 20% of rows", sub: "when autovacuum wakes up (defaults)", tone: cyan}
  full: {kind: label, text: "VACUUM FULL", sub: "a smaller file, but the table is locked", tone: amber}
  idle: {kind: label, text: "pid 4127", sub: "idle in transaction · 1h 02m", tone: amber}
  slots: {kind: label, text: "slots · prepared xacts", sub: "they hold cleanup back too", tone: amber}
  w3:
    kind: code
    file: mvcc.go · IdleInTransaction
    code: |
      rows, _ := pool.Query(ctx, `
          SELECT pid,
                 EXTRACT(EPOCH FROM now() - xact_start)::bigint
          FROM pg_stat_activity
          WHERE state = 'idle in transaction'`)
  dial: {kind: dial}
  freeze: {kind: label, text: "200,000,000", sub: "autovacuum_freeze_max_age (default)", tone: cyan}
  bits: {kind: label, text: "32 bits", sub: "xmin and xmax in every row version", tone: amber}
  mandrill: {kind: label, text: "Mandrill · 4 Feb 2019", sub: "one busy shard; autovacuum fell behind", tone: cyan}
  hour: {kind: label, text: "40 days → 1 hour", sub: "after emptying two huge tables", tone: green}
  hours: {kind: label, text: "~40 hours", sub: "of impaired sending · Sentry: July 2015", tone: red}
  w4:
    kind: code
    file: mvcc.go · Overdue
    code: |
      rows, _ := pool.Query(ctx,
          `SELECT datname, age(datfrozenxid) FROM pg_database`)
      for rows.Next() {
          rows.Scan(&name, &age)
          if age > limit {        // say, a billion: half way
              overdue = append(overdue, name)
          }
      }
  turns: {kind: label, text: "writers still take turns", sub: "the second waits for the first", tone: amber}
  cost: {kind: label, text: "new version + index entries", sub: "for every update", tone: red}
  hot: {kind: label, text: "HOT update", sub: "no indexed column changed + room on the page", tone: green}
  part: {kind: label, text: "short transactions", sub: "no idle sessions · watch VACUUM and XID age", tone: green}
  # s07: the trade-offs, each in code
  w5:
    kind: code
    file: mvcc.go · Withdraw
    code: |
      opts := pgx.TxOptions{IsoLevel: pgx.RepeatableRead}
      for attempt := 0; attempt < 3; attempt++ {
          err = pgx.BeginTxFunc(ctx, pool, opts, func(tx pgx.Tx) error {
              tx.QueryRow(ctx, readBalance, id).Scan(&balance)
              if balance < amount { return ErrInsufficient }
              _, err := tx.Exec(ctx, writeBalance, balance-amount, id)
              return err
          })
          if !errors.As(err, &pgErr) || pgErr.Code != "40001" {
              return err   // nil, or a failure a retry won't fix
          }
      }
  wa: {kind: key, text: "A: -$30"}
  wb: {kind: key, text: "B: -$30"}
  e40001: {kind: label, text: "40001", sub: "could not serialize access: tx A got there first", tone: red}
  retried: {kind: label, text: "retry: $70 → $40", sub: "the same transaction, on a fresh snapshot", tone: green}
  lostrc: {kind: label, text: "read committed: both write $70", sub: "one $30 withdrawal is lost", tone: red}
  w6:
    kind: code
    file: hot.sql
    code: |
      SELECT n_tup_upd, n_tup_hot_upd,
             round(100.0 * n_tup_hot_upd / nullif(n_tup_upd, 0)) AS hot_pct
      FROM pg_stat_user_tables
      WHERE relname = 'accounts';

      -- low on a busy table? leave room on each new page:
      ALTER TABLE accounts SET (fillfactor = 90);
  w7:
    kind: code
    file: mvcc.go · NewPool
    code: |
      cfg, err := pgxpool.ParseConfig(url)
      if err != nil { return nil, err }
      params := cfg.ConnConfig.RuntimeParams
      params["idle_in_transaction_session_timeout"] = "60000"
      params["statement_timeout"] = "30000"
      return pgxpool.NewWithConfig(ctx, cfg)

