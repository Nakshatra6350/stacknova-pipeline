  - at: e6.version-0.2
    shot: {kind: look, at: "bucket:0", dist: 2.5, height: 0.4, angle: -8}
    world: {put: "$70 · xmin 105#a2", bucket: 0, from: "top:0", dur: 0.45, tone: amber}
    hud: {callout: "MORE THAN ONE VERSION", tone: amber, for: 1.8}
  - at: e6>
    world: {remove: "$70 · xmin 105#a2"}
  # ---------------------------------------------------------------- s03 a read that never waits (walkthrough 1)
  - at: e7
    shot: {kind: look, at: [-0.24, 1.62, 1.05], dist: 1.75, height: 0.04, fov: 34}
    hud: {step: 2}
    prop: {id: w1, place: [-0.66, 1.74, 1.0], type: true, dur: 1.6}
