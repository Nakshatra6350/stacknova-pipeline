  #Shorts #java #javadeveloper #backenddeveloper #codinginterview
caption: |
  HashMap never searches. 🔑

  What happens when you call map.get("user:42"):
  1️⃣ Java turns the key into a number: "user:42".hashCode() = -147170163
  2️⃣ It mixes the top 16 bits into the bottom: h ^ (h >>> 16)
  3️⃣ With 16 buckets it keeps only the last 4 bits: 0111 → bucket 7
  4️⃣ One jump, no searching. That's why get() is O(1) on average.

  The part most people mix up: two keys can land in the same bucket. That's a collision: the bucket keeps a short chain, and equals() finds the right key.

