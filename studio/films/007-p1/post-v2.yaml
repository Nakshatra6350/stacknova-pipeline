caption: |
  HashMap never searches. Here's how Java finds any key in one jump 🔑

  map.get("user:42"):
  1️⃣ "user:42".hashCode() turns the key into a number
  2️⃣ h ^ (h >>> 16) mixes the top bits into the bottom
  3️⃣ With 16 buckets, the last 4 bits pick the bucket: 0111 → bucket 7
  4️⃣ One jump, no loop. That's why get() is O(1) on average.

  Two keys in the same bucket? That's a hash collision: the bucket keeps a short chain, and equals() finds the right key.

  Java HashMap internals, part 1 of 4. Part 2 tomorrow: when a bucket becomes a tree 🌳

