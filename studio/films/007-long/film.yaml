      table = newTable(oldCap * 2);
      Node<K, V> next;
      for (int j = 0; j < oldCap; j++) {
          for (Node<K, V> e = old[j]; e != null; e = next) {
              next = e.next;
              int i = (e.hash & oldCap) == 0 ? j : j + oldCap;
              e.next = table[i];
              table[i] = e;
          }
      }
