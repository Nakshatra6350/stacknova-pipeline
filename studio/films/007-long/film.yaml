  load: {kind: gauge, text: "entries in 16 buckets", max: 16, limit: 12}
  w3:
    kind: code
    file: MiniMap.java · resize()
    code: |
      table = newTable(oldCap * 2);
      Node<K, V> next;
      for (int j = 0; j < oldCap; j++) {
          for (Node<K, V> e = old[j]; e != null; e = next) {
              next = e.next;
              int i = (e.hash & oldCap) == 0 ? j : j + oldCap;
              e.next = table[i];
              table[i] = e;
          }
      }
