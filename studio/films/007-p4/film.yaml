      - {put: "user:cara", bucket: 7}
      - {put: "user:eli", bucket: 2}
      - {put: "user:fay", bucket: 14}
      - {put: "user:hana", bucket: 6}
      - {put: "user:jade", bucket: 9}
      - {put: "user:kai", bucket: 6}
      - {put: "user:lena", bucket: 4}
      - {put: "user:maya", bucket: 11}
      - {put: "user:nia", bucket: 5}
      - {put: "user:omar", bucket: 15}
