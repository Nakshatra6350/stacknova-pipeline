caption: |
  new HashMap<>(100) is not room for 100 entries 📦

  1️⃣ 100 is a capacity. Java rounds it up to a power of two: 128 buckets
  2️⃣ The default load factor is 0.75, so the map resizes after 96 entries
  3️⃣ Entry 97 doubles the table to 256 buckets and moves every entry
  4️⃣ Since Java 19, HashMap.newHashMap(100) sizes the table so 100 entries fit without a resize

  Why 0.75? Fuller tables mean longer chains; emptier ones waste memory.

