cover: {t: 41.5, title: "When a bucket becomes a tree", series: "Java HashMap, part 2 of 4", part: 2, of: 4}
caption: |
  8 keys in one HashMap bucket. The 9th arrives. Does it become a tree? Usually not 🌳

  1️⃣ Java wants to treeify a bucket at 8 keys
  2️⃣ But trees need a table of at least 64 buckets
  3️⃣ With only 16, it doubles the table instead: 16 → 32
  4️⃣ No rehashing: each key checks one more bit of its stored hash. 0 stays in bucket 7, 1 moves to 7 + 16 = 23
  5️⃣ At 64+ buckets, a crowded bucket becomes a red-black tree: O(log n) instead of the whole chain

  Java HashMap internals, part 2 of 4. Part 3 tomorrow: the key that vanished 👻

