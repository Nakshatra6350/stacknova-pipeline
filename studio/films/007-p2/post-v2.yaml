description: |
  In Java 8 and later, a HashMap bucket holding 8 colliding keys can turn into a red-black tree, but only once the table has 64 buckets. Before that, the ninth key doubles the table instead, and every key checks one more bit of the hash it already stored to find its new bucket. No rehashing.

