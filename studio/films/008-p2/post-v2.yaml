cover: {t: 12.0, title: "One UPDATE, two rows", series: "Postgres MVCC, part 2 of 4", part: 2, of: 4}
caption: |
  A Postgres UPDATE doesn't change your row. It writes a new one 🔍

  1️⃣ Postgres runs an UPDATE as an INSERT plus a DELETE
  2️⃣ The old version gets an xmax: the transaction that replaced it
  3️⃣ The new version gets an xmin: the transaction that wrote it
  4️⃣ SELECT xmin, xmax, ctid shows them; update the row and its ctid (its physical address) moves
  5️⃣ The old version stays on disk until no transaction can see it, then VACUUM takes the space back

  Postgres MVCC, part 2 of 4. Part 3 tomorrow: the idle transaction that stops the cleanup

