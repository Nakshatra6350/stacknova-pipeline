caption: |
  Postgres can refuse every write with plenty of disk left. The cause is a 32-bit counter ⏳

  1️⃣ Transaction IDs are 32 bits: about 4 billion
  2️⃣ Postgres compares them on a circle: about 2 billion in the past, 2 billion in the future
  3️⃣ Old rows must be frozen before the counter comes back around: that's VACUUM's job too
  4️⃣ If VACUUM falls behind, Postgres warns, then 3 million IDs before the edge it stops starting writes. Reads keep working.

  Watch age(datfrozenxid) for every database, and make sure autovacuum can finish.

  Postgres MVCC, part 4 of 4. The full MVCC deep dive is on YouTube: @StackNovaDev

