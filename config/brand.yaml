name: "StackNova"
tagline: "Light up your whole stack."
meaning: >-
  stack + nova. A nova is a star that suddenly shines far brighter — what the channel does for a
  backend engineer's understanding of their whole stack.
handles:                      # plain handle first; if taken, the .dev style (owner's choice)
  youtube:   ["@stacknova", "@stacknovadev"]        # YouTube handles can't contain dots
  instagram: ["@stacknova", "@stacknova.dev"]
  confirmed:                  # confirmed by the owner on 9 Oct 2026 — use these everywhere
    youtube: "@StackNovaDev"
    instagram: "@stacknova.dev"
accounts:
  brand_email: "stacknova.dev@gmail.com"            # suggested; confirm after creating
  github_repos:
    pipeline: "stacknova-pipeline"                  # public
    content: "stacknova-content"                    # private
  telegram_bot: "StackNova Studio (@stacknova_studio_bot)"
logo:
  concept: >-
    "Nova Stack": three glowing isometric tech layers (violet → pink → orange, the stack) with a
    golden four-point supernova bursting from the top layer (the nova). 3D neon-glass style.
    Wordmark: "Stack" white + "Nova" pink→orange→gold gradient, Inter Display ExtraBold.
    Tagline lockup: LIGHT UP YOUR WHOLE STACK in spaced caps between two violet hairlines.
  source: "brand-assets/source/emblem-1264.jpg"   # AI-generated in Canva (media MAHXgbOcNuA)
  full_lockup: "brand-assets/stacknova-logo-full-1600.png"
  avatar: "emblem only, full-bleed, dark background"
colors:
  background: "#020008"
  surface: "#17122E"
  text: "#FFFFFF"
  muted: "#B7B0D6"
  violet: "#7B5CFF"
  pink: "#FF4D8D"
  orange: "#FF8A3D"
  gold: "#FFD24D"
  accent: "#FF4D8D"           # caption highlight + key elements
  gradient: ["#7B5CFF", "#FF4D8D", "#FF8A3D"]
  warn: "#FFB547"
  danger: "#FF5C5C"
fonts:
  sans: "Inter"
  sans_bold: "Inter Display ExtraBold"
  mono: "JetBrains Mono"
watermark: "bottom-right"     # emblem, 6% width, 70% opacity
video:                        # what the planner adds around an episode's scenes (decided 12 Oct 2026)
  transition: slide           # how one scene gives way to the next: slide | wipe | zoom | none
  intro:                      # long videos only, played AFTER the first segment: "hook first always then intro"
    seconds: 4.3
    sound: null               # a sound made by src/channel_os/brand/sound.py, like the outro's music.
                              # None yet: the owner is choosing between three; until then the intro is silent
  outro:                      # long videos only; no voice, music only
    seconds: 12
    music: lofi-nod           # the owner's pick (option 2); made by src/channel_os/brand/sound.py
    cadence: "two deep dives a week"
  handle:                     # Instagram handle as a lower third on long videos
    at: [0.35, 0.7]           # shares of the way through the episode
    seconds: 5
  shorts_prompt:              # like / comment / share / subscribe over the end of a Short
    seconds: 3                # no intro and no end card on Shorts (docs/REACH_PLAYBOOK.md)
    ask: Subscribe            # the last button's word; the Reel cut of a Short says Follow (M3)
bios:                         # paste-ready versions in BRAND_PROFILE_TEXT.md
  youtube_name: "StackNova"
  instagram_name: "StackNova | Backend Systems"
  see: "BRAND_PROFILE_TEXT.md"
assets:
  youtube_profile: "brand-assets/youtube-profile-800.png"
  youtube_banner: "brand-assets/youtube-banner-2560x1440.png"
  instagram_profile: "brand-assets/instagram-profile-1080.png"
  full_lockup: "brand-assets/stacknova-logo-full-1600.png"
  source: "brand-assets/render.py"   # re-render with: python brand-assets/render.py (needs playwright)
