# The looks scenes are drawn in (look v2). Read by src/channel_os/scenes/theme.py and handed to
# the page as CSS variables. The owner asked for two looks, alternated: with no `theme` in
# episode.yaml the long video of episode n uses rotation[(n-1) mod k] and its Short j uses
# rotation[(n-1+j) mod k], so neighbouring assets differ.
rotation: [control, nova]
fonts: {mono: "JetBrains Mono", sans: "Inter", display: "Inter Display"}
themes:
  # A neutral control room: the stage stays out of the way and each system has its own colour.
  control:
    stage: "#0a0f14"      # frame background
    stage2: "#121c25"     # the lighter centre of the background glow
    panel: "#131b23"      # cards and panels
    panel2: "#19242e"     # caption bar
    line: "#27384a"       # borders, the track
    ink: "#eaf0f4"        # main text
    muted: "#8d9cab"      # labels
    dim: "#566675"        # older log lines, placeholders
    code: "#0c1218"       # code and payload boxes
    client: "#d5dee6"     # the phone / the caller
    a: "#34d3a4"          # first system
    b: "#f3a944"          # second system
    c: "#b48cff"          # third system
    d: "#5b9bff"          # fourth system
    ok: "#3ddc84"
    err: "#ff6b6b"
    retry: "#ff9f6b"
    jk: "#b48cff"         # keys in JSON and code
    js: "#7fe0b8"         # strings
    jn: "#f3b562"         # numbers
  # The same room lit in the StackNova colours.
  nova:
    stage: "#06030e"
    stage2: "#150c2c"
    panel: "#120d26"
    panel2: "#1a1437"
    line: "#32295e"
    ink: "#ffffff"
    muted: "#b3abd8"
    dim: "#6c6499"
    code: "#0b0719"
    client: "#e9e4ff"
    a: "#9a86ff"
    b: "#ffd24d"
    c: "#ff5c9a"
    d: "#5fd0ff"
    ok: "#5fe0a8"
    err: "#ff5c5c"
    retry: "#ff8a3d"
    jk: "#ff8fb8"
    js: "#ffd98a"
    jn: "#a995ff"
