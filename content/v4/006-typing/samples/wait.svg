<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 186" style="width:128mm;height:auto" font-family="JetBrains Mono, monospace">
  <!-- Why polling is half an interval late on average: a signal lands anywhere between two asks. -->
  <g font-size="12">
    <text x="0" y="14" fill="#f4f1ff" font-weight="700">polling, once a second</text>
    <line x1="10" y1="52" x2="510" y2="52" stroke="#2a2350" stroke-width="2"/>
    <g fill="#7b5cff"><rect x="28" y="40" width="6" height="24" rx="2"/><rect x="148" y="40" width="6" height="24" rx="2"/><rect x="268" y="40" width="6" height="24" rx="2"/><rect x="388" y="40" width="6" height="24" rx="2"/><rect x="508" y="40" width="6" height="24" rx="2"/></g>
    <g fill="#a29bc4" font-size="10" text-anchor="middle"><text x="31" y="34">ask</text><text x="151" y="34">ask</text><text x="271" y="34">ask</text><text x="391" y="34">ask</text><text x="511" y="34" text-anchor="end">ask</text></g>
    <circle cx="200" cy="52" r="7" fill="#ffd24d"/>
    <rect x="200" y="74" width="72" height="8" rx="4" fill="#ff7a88"/>
    <text x="200" y="97" fill="#ff7a88" font-weight="700">waits for the next ask</text>
    <text x="400" y="80" fill="#a29bc4" font-size="10" text-anchor="middle">empty</text><text x="400" y="93" fill="#a29bc4" font-size="10" text-anchor="middle">replies</text>
    <text x="0" y="124" fill="#f4f1ff" font-weight="700">a WebSocket</text>
    <line x1="10" y1="154" x2="510" y2="154" stroke="#5fe3a8" stroke-width="2"/>
    <circle cx="200" cy="154" r="7" fill="#ffd24d"/>
    <path d="M200 143 L200 133 L212 138 z" fill="#5fe3a8"/>
    <text x="216" y="142" fill="#5fe3a8" font-weight="700">delivered as it happens</text>
    <text x="0" y="180" fill="#a29bc4">The yellow dot is one "typing" signal, landing at a random moment.</text>
  </g>
</svg>
