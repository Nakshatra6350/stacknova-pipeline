<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" style="width:128mm;height:auto" font-family="JetBrains Mono, monospace">
  <!-- The search outward: own cell, ring 1, and the circle that proves nothing closer exists. -->
  <g font-size="11">
    <rect x="10" y="10" width="240" height="240" rx="6" fill="#110d24" stroke="#2a2350"/>
    <rect x="58" y="58" width="144" height="144" fill="#7b5cff" fill-opacity=".14" stroke="#7b5cff"/>
    <rect x="106" y="106" width="48" height="48" fill="#7b5cff" fill-opacity=".35" stroke="#7b5cff" stroke-width="2"/>
    <g stroke="#2a2350" stroke-dasharray="3 3">
      <line x1="58" y1="10" x2="58" y2="250"/><line x1="106" y1="10" x2="106" y2="250"/><line x1="154" y1="10" x2="154" y2="250"/><line x1="202" y1="10" x2="202" y2="250"/>
      <line x1="10" y1="58" x2="250" y2="58"/><line x1="10" y1="106" x2="250" y2="106"/><line x1="10" y1="154" x2="250" y2="154"/><line x1="10" y1="202" x2="250" y2="202"/>
    </g>
    <circle cx="146" cy="128" r="23" fill="none" stroke="#5fe3a8" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="114" cy="140" r="5" fill="#ff7a88"/>
    <circle cx="166" cy="118" r="5" fill="#5fe3a8"/>
    <circle cx="146" cy="128" r="6" fill="#58a6ff" stroke="#fff" stroke-width="2"/>
    <circle cx="40" cy="40" r="4" fill="#ffd24d"/><circle cx="226" cy="70" r="4" fill="#ffd24d"/><circle cx="80" cy="226" r="4" fill="#ffd24d"/><circle cx="214" cy="214" r="4" fill="#ffd24d"/>
    <text x="270" y="24" fill="#f4f1ff" font-weight="700">1. Your own cell</text>
    <text x="270" y="40" fill="#ff7a88">the best driver in it is red</text>
    <text x="270" y="66" fill="#f4f1ff" font-weight="700">2. Is that safe? No.</text>
    <text x="270" y="82" fill="#a29bc4">red is further away than the</text>
    <text x="270" y="96" fill="#a29bc4">edge of the cell: someone closer</text>
    <text x="270" y="110" fill="#a29bc4">could be just outside</text>
    <text x="270" y="136" fill="#f4f1ff" font-weight="700">3. Add ring 1: 8 more cells</text>
    <text x="270" y="152" fill="#5fe3a8">green, over the line, is closer</text>
    <text x="270" y="178" fill="#f4f1ff" font-weight="700">4. Safe now? Yes.</text>
    <text x="270" y="194" fill="#a29bc4">the green circle fits inside the</text>
    <text x="270" y="208" fill="#a29bc4">searched block: nobody outside</text>
    <text x="270" y="222" fill="#a29bc4">can be closer</text>
    <text x="270" y="246" fill="#a29bc4">If not, add ring 2 and check again.</text>
  </g>
</svg>
