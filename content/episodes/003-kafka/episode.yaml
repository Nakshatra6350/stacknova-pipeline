fact_check:
  - claim: "Kafka does not delete events after consumption; retention is configured per topic"
    source: https://kafka.apache.org/intro
  - claim: "Topics are partitioned over brokers; events with the same key go to the same partition, read in the order written"
    source: https://kafka.apache.org/intro
  - claim: "Each partition is consumed by exactly one consumer within a consumer group at any time; committed offsets mark progress"
    source: https://docs.confluent.io/kafka/design/consumer-design.html
  - claim: "A consumer that does not poll within max.poll.interval.ms is assumed to have failed, and its partitions go to another member"
    source: https://docs.confluent.io/platform/current/clients/consumer.html
  - claim: "Processing before saving the position is at-least-once (a crash replays); saving first is at-most-once (a crash loses)"
    source: https://docs.confluent.io/kafka/design/delivery-semantics.html
  - claim: "The idempotent producer: the broker assigns each producer an id and deduplicates by sequence number"
    source: https://docs.confluent.io/kafka/design/delivery-semantics.html
  - claim: "Since Kafka 3.0 the producer enables idempotence (and acks=all) by default"
    source: https://cwiki.apache.org/confluence/display/KAFKA/KIP-679%3A+Producer+will+enable+the+strongest+delivery+guarantee+by+default
  - claim: "Kafka transactions give exactly-once for consume-process-produce inside Kafka; external systems need coordination"
    source: https://docs.confluent.io/kafka/design/delivery-semantics.html
  - claim: "Slack's Redis job queue hit its memory limit after database contention slowed jobs, stayed locked after recovery, and Slack put Kafka in front of Redis"
    source: https://slack.engineering/scaling-slacks-job-queue/
  - claim: "The consumer commits offsets only after applying the batch, with auto-commit off"
    source: "derived from code sample samples/go/consumer.go"

