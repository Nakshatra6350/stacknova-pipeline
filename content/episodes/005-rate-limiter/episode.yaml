fact_check:
  - claim: "Stripe uses a token bucket per user in Redis for its request rate limiter, which rejected millions of requests in a month, often from test-mode scripts"
    source: https://stripe.com/blog/rate-limiters
  - claim: "Stripe also runs a concurrent requests limiter and two load shedders (fleet usage, worker utilization), shedding test traffic first, and builds them to fail open"
    source: https://stripe.com/blog/rate-limiters
  - claim: "Stripe's concurrent requests limiter keeps its CPU-intensive endpoints under control, and its advice is to start with the request rate limiter"
    source: https://stripe.com/blog/rate-limiters
  - claim: "429 Too Many Requests means the user sent too many requests in a given time; the response may include Retry-After"
    source: https://www.rfc-editor.org/rfc/rfc6585#section-4
  - claim: "An IETF draft defines RateLimit and RateLimit-Policy header fields"
    source: https://datatracker.ietf.org/doc/draft-ietf-httpapi-ratelimit-headers/
  - claim: "Redis runs a Lua script atomically: no other command runs while it executes"
    source: https://redis.io/docs/latest/develop/programmability/eval-intro/
  - claim: "A fixed window lets 2x the limit through across a window boundary; the sliding window counter weighs the previous window by its overlap (2/3 at 20 s)"
    source: "derived from code sample samples/java/limits/FixedWindow.java and arithmetic"

