  description: |
    In December 2011, one crafted web request could keep a server's CPU at 100% for hours, and the
    weapon was the hash map. Here is how Java's HashMap really works: hashCode and the bit mix, the
    bucket index, collisions and equals, the 0.75 load factor and the resize that splits every
    chain by one bit, red-black tree buckets, and the 2011 hash flooding attack they stopped. Eight
    walkthroughs of real Java code, line by line, from the bucket index to a thread-safe
    counter and an LRU cache.

