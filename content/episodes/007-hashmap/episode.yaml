fact_check:
  - claim: "A record's components are private final fields, and its equals and hashCode are derived from them; assigning to a component field does not compile"
    source: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Record.html
  - claim: "HashMap is not synchronized: if threads modify it structurally at the same time, access must be synchronized externally"
    source: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/HashMap.html
  - claim: "Counting 100,000 increments into a HashMap from many threads at once gave 95,078, 94,451 and 99,423 in three runs; ConcurrentHashMap gave 100,000 every time (RaceCount, run with 16 platform threads on Java 17; the video's version uses virtual threads)"
    source: "derived from code sample"
  - claim: "ConcurrentHashMap.merge performs the entire method invocation atomically"
    source: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html
  - claim: "ConcurrentHashMap puts a node into an empty bin with a compare-and-swap, and otherwise synchronizes only on that bin's first node"
    source: https://github.com/openjdk/jdk/blob/master/src/java.base/share/classes/java/util/concurrent/ConcurrentHashMap.java
  - claim: "Executors.newVirtualThreadPerTaskExecutor (Java 21+) starts a virtual thread per task; closing the executor in try-with-resources waits for submitted tasks"
    source: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Executors.html#newVirtualThreadPerTaskExecutor()
  - claim: "Putting ana, tom, kai and zoe into a new HashMap iterates as [zoe, kai, tom, ana] (buckets 1, 2, 3 and 5), while a LinkedHashMap gives [ana, tom, kai, zoe]"
    source: "derived from code sample"
  - claim: "LinkedHashMap keeps a doubly-linked list of its entries in insertion order or, with the access-order constructor, in access order; overriding removeEldestEntry makes it a bounded cache"
    source: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/LinkedHashMap.html
  - claim: "An access-ordered LinkedHashMap of size 3 holding ana, bo, leo: get(ana) then put(dee) drops bo and leaves [leo, ana, dee]"
    source: "derived from code sample"
  - claim: "HashMap.newHashMap(100) (Java 19+) sizes the table for 100 mappings: ceil(100 / 0.75) = 134, rounded up to 256 buckets, so 100 entries fit without a resize"
    source: https://github.com/openjdk/jdk/blob/master/src/java.base/share/classes/java/util/HashMap.java
  - claim: "oCERT-2011-003 (released 28 December 2011): crafted HTTP requests could drive CPU to 100% for up to several hours; Java, PHP, Python and Ruby were among the affected; the risk comes from servers that do not limit POST parameters"
    source: https://ocert.org/advisories/ocert-2011-003
  - claim: "Alexander Klink and Julian Wälde presented the attack at 28C3 (the Chaos Communication Congress, December 2011)"
    source: https://fahrplan.events.ccc.de/congress/2011/Fahrplan/events/4680.en.html
  - claim: "HashMap gives constant-time get and put when the hash function spreads keys well; it makes no guarantee about order, which may change over time"
    source: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/HashMap.html
  - claim: "Equal objects must return the same hashCode"
    source: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html#hashCode()
  - claim: "String.hashCode is s[0]*31^(n-1) + ... + s[n-1]: built from the characters with 31 as the multiplier"
    source: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/String.html#hashCode()
  - claim: "hash(key) is h ^ (h >>> 16); with power-of-two masking, hashes that differ only above the mask would always collide"
    source: https://github.com/openjdk/jdk/blob/master/src/java.base/share/classes/java/util/HashMap.java
  - claim: "The default capacity is 16 and the default load factor 0.75: the 13th put (size > 12) doubles a 16-bucket table to 32"
    source: https://github.com/openjdk/jdk/blob/master/src/java.base/share/classes/java/util/HashMap.java
  - claim: "On a resize each node keeps its stored hash: (hash & oldCap) == 0 stays at j, otherwise moves to j + oldCap"
    source: https://github.com/openjdk/jdk/blob/master/src/java.base/share/classes/java/util/HashMap.java
  - claim: "Adding to a bucket with at least 8 nodes (TREEIFY_THRESHOLD) makes it a tree, but a table under 64 buckets (MIN_TREEIFY_CAPACITY) is resized instead; a split bin of 6 or fewer (UNTREEIFY_THRESHOLD) becomes a list again"
    source: https://github.com/openjdk/jdk/blob/master/src/java.base/share/classes/java/util/HashMap.java
  - claim: "Under random hashCodes at load factor 0.75, the chance of a bin of 8 is 0.00000006; TreeNodes are about twice the size of regular nodes"
    source: https://github.com/openjdk/jdk/blob/master/src/java.base/share/classes/java/util/HashMap.java
  - claim: "Tree bins order keys by hash, then by compareTo when keys are Comparable"
    source: https://github.com/openjdk/jdk/blob/master/src/java.base/share/classes/java/util/HashMap.java
  - claim: "JEP 180 (Java 8) turns heavily colliding buckets into balanced trees, improving worst-case behaviour for Comparable keys"
    source: https://openjdk.org/jeps/180
  - claim: "\"Aa\".hashCode() == \"BB\".hashCode() == 2112; joining pairs gives 2^n strings with one hashCode (14 pairs: 16,384 keys)"
    source: "derived from code sample samples/java/hashmap/Collide.java"
  - claim: "user:42 spreads to -147149897, whose last 4 bits are 0111: bucket 7 of 16; user:97 also lands in bucket 7"
    source: "derived from code sample samples/java/hashmap/MiniMap.java"
  - claim: "Tomcat's maxParameterCount defaults to 10,000"
    source: https://tomcat.apache.org/tomcat-7.0-doc/config/http.html
  - claim: "HashMap is not synchronized: concurrent structural changes need outside synchronization; ConcurrentHashMap is the concurrent map"
    source: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/HashMap.html
  - claim: "LinkedHashMap keeps insertion order"
    source: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/LinkedHashMap.html
  - claim: "new HashMap<>(100) rounds the capacity up to 128 and resizes after 96 entries; HashMap.newHashMap(int), since Java 19, sizes a map so the expected mappings fit without a resize"
    source: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/HashMap.html
  - claim: "Each HashMap node holds a hash, a key, a value and a next pointer"
    source: https://github.com/openjdk/jdk/blob/master/src/java.base/share/classes/java/util/HashMap.java

