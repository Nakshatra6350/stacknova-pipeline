shorts:
  - id: short-1
    source: standalone
    film: studio/films/007-p1
    hook_on_screen: "WHERE IS user:42?"
    script: >-
      user:42… not in locker 0. Not in 1. Not in 2! Stop. A HashMap never searches. Then how
      does it find anything? Let me show you what's underneath. Java turns the key into a number,
      its hashCode, and mixes in the top bits. With 16 buckets, it keeps only the last four bits.
      0111. Bucket 7. One jump. One jump? No searching at all? None. That's why a lookup is O(1),
      on average. Uh oh. user:97 just landed in locker 7 too. That can't be legal! It's a
      collision. The bucket keeps a short chain, and equals finds the right key. And if 8 keys
      pile up in one bucket? Then Java grows the table, or turns the chain into a tree. That's
      part two.
    youtube_title: "HashMap Never Searches: How Java Finds Keys in O(1) #Shorts"
    instagram_caption: |
      HashMap never searches. 🔑 Java hashes the key, keeps the last bits, and jumps straight to
      one bucket. Part 2: what happens when 8 keys pile up in one bucket 🌳
    pillar_hashtags: jvm-java
  - id: short-2
    source: standalone
    film: studio/films/007-p2
    hook_on_screen: "8 KEYS. ONE BUCKET."
    script: >-
      Locker 7 is jammed! 8 orders, one bucket. Every lookup walks the whole chain! Watch what
      happens when a ninth one lands. It joins the line? Java wants a tree here. But the table
      has only 16 buckets, and trees need 64. So it doubles the table instead. 32 lockers! Does
      every key need a new hash now? No. Each key checks one more bit of the hash it already has.
      0, it stays in 7. 1, it moves to 23. The long chain splits in two! And once the table has
      64 buckets, a crowded bucket becomes a red-black tree. Finding a key takes a few hops
      instead of the whole chain. Trees inside lockers. Nice. Part 3: the key that vanished.
    youtube_title: "When a HashMap Bucket Becomes a Tree (Java Resize) #Shorts"
    instagram_caption: |
      8 keys jam one bucket, a 9th arrives: Java doubles the table (16 → 32) and each key checks
      one more bit to find its new bucket. At 64+ buckets, a crowded bucket becomes a tree. 🌳
    pillar_hashtags: jvm-java
  - id: short-3
    source: standalone
    film: studio/films/007-p3
    hook_on_screen: "get() SAYS NULL"
    script: >-
      I put Ana in the map. Now get says null. The map lost her! It didn't. Look. She's still in
      bucket 3. Then why can't get find her? After you put her in, you changed her email. And
      email is part of her hashCode. New email, new hash, new bucket. get jumps straight to
      bucket 8, finds nothing, and gives up. So she's stuck in locker 3 forever? get, containsKey
      and remove all look in the wrong bucket. Only a full scan still sees her. That's a quiet
      memory leak. How do I stop it? Never change a field that equals or hashCode uses while the
      object is a key. Use immutable keys: a String, or a record of immutable values. Part 4: why
      a HashMap of 100 isn't room for 100.
    youtube_title: "Java HashMap: get() Says null, Key Is Still There #Shorts"
    instagram_caption: |
      get() returned null, but the entry is still in the map. 👻 Change a field hashCode() uses
      after the put and HashMap looks in the wrong bucket. Use immutable keys.
    pillar_hashtags: jvm-java
  - id: short-4
    source: standalone
    film: studio/films/007-p4
    hook_on_screen: "100 ISN'T ROOM FOR 100"
    script: >-
      I made a HashMap for 100 users. It still stopped to resize! Because that 100 is a capacity,
      not how many entries fit. Isn't that the same thing? Java rounds it up to a power of two:
      128 buckets. But it grows when the map is three quarters full. 75% of 128 is 96. So entry 97
      doubles everything? Every entry moves to a new table of 256 buckets. Work you never planned
      for. Since Java 19, ask for HashMap.newHashMap(100). It sizes the table so 100 really fit.
      Why three quarters, though? Fuller tables mean longer chains. Emptier ones waste memory. The
      full deep dive on HashMap is out Tuesday.
    youtube_title: "new HashMap(100) Isn't Room for 100 Entries (Java) #Shorts"
    instagram_caption: |
      new HashMap<>(100) resizes at entry 97. 📦 Since Java 19, HashMap.newHashMap(100) sizes the
      table so 100 entries fit.
    pillar_hashtags: jvm-java
  - id: short-5
    source: standalone
    film: studio/films/007-reel
    hook_on_screen: "ONE REQUEST. CPU 100%."
    script: >-
      The server is at 100% CPU. And it's all from one request! December 2011. One request like
      that could keep a CPU busy for hours. Java, PHP, Python, Ruby: all exposed. What's inside
      it? Thousands of form fields. The server puts every field name into a hash map. And every
      one of these names has the same hash code. How is that even possible? In Java, "Aa" and "BB"
      both hash to 2112. Glue pairs together, and every combination collides too. 14 pairs make
      16,384 keys, all with one hash. So they all land in one bucket! One giant chain. Each new
      key walks the whole chain before it's added. Twice the keys, four times the work. And the
      server just chokes? For hours. The fix came in two parts. Servers capped how many
      parameters one request may carry. And Java 8 changed the bucket itself. A crowded bucket
      becomes a red-black tree. Even when every key has the same hash? Strings are Comparable,
      so the tree can still sort them. Each key takes a few hops, not the whole chain. A tree
      stopped an attack! It capped the damage. How HashMap really works, from the first jump to
      that tree, is in the full deep dive on our channel.
    youtube_title: "The 2011 Attack That Froze Servers With One Request #Shorts"
    instagram_caption: |
      One web request, 100% CPU for hours. 🧨 Thousands of form fields, all with the same hash
      code, in one HashMap bucket. Java 8's fix: turn a crowded bucket into a tree.
    pillar_hashtags: jvm-java

