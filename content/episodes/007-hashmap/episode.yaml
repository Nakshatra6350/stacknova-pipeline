segments:
  - id: s01
    title: One request, one CPU at 100%
    narration: >-
      December 2011. Two researchers show that one crafted web request can keep a server's CPU at
      100% for hours. One request? What was inside it? Thousands of form fields. Java, PHP,
      Python, Ruby: all of them were exposed. And the weapon was the hash map. The hash map? The
      thing that's supposed to be O(1)? That's the promise they broke. By the end, you'll see
      exactly how, and why it can't happen the same way today. Every digital frontier begins with
      an idea. What brings it to life is the engineering beneath it. Welcome to StackNova —
      exploring the architecture of tomorrow, one system at a time.
  - id: s02
    title: What most people picture
    narration: >-
      I always pictured a map as a row of lockers. To find user:42, I open locker 0, then 1, then
      2. That's what most people picture. With ten keys, it's fine. With a million keys, a lookup
      for a missing key opens a million lockers. That's O(n). So how does a real HashMap skip the
      search? It never searches. It works out where the key must be, and jumps there.
  - id: s03
    title: From key to bucket
    narration: >-
      Let's see it in code. This is a small map I wrote that finds keys the same way Java's does.
      Line 2 asks the key for its hashCode, a 32-bit number. Every Java object has one, and equal
      objects must return the same number. A String builds its hashCode from its characters,
      multiplying by 31 at every step. Line 3 mixes the top 16 bits into the bottom 16. A small
      table only looks at the bottom bits, so without this mix, keys that differ only up high
      would always collide. And then it picks a bucket? Line 8. The table's size is always a
      power of two, like 16. hash & (length - 1) keeps only the last 4 bits. For user:42, that's
      0111: bucket 7. No loop. No search. One jump. That's the O(1).
  - id: s04
    title: Two keys, one bucket
    narration: >-
      But 16 buckets and a million keys? They can't all get their own locker. They can't. Two
      keys in one bucket is a collision, and it's normal. The bucket keeps them in a short chain.
      Here's the lookup. Line one jumps to the bucket. Line two walks its chain, node by node.
      Line three checks the stored hash first. Comparing two numbers is cheap, so most wrong keys
      fail right there. Only when the hashes match does it call equals. That's the real
      comparison, and it decides. Reach the end of the chain with no match, and line 7 returns
      null. So a lookup is one jump, plus a walk down a short chain. Exactly. And Java works hard
      to keep that chain short.
  - id: s05
    title: Resize without rehashing
    narration: >-
      It keeps chains short by growing the table. The rule is the load factor: 0.75. 16 buckets
      × 0.75 is 12. Put a 13th entry, and the table doubles to 32. Does every key need a new
      hash then? No. Each node remembers its hash. Here's the resize. Line 3 visits every old
      bucket. Line 4 walks each chain. And line 6 tests one more bit of the stored hash: the bit
      worth the old size, 16. 0, and the node stays at the same index. 1, and it moves to the
      index plus 16. Bucket 7's chain splits between 7 and 23. No new hash codes, and each chain
      splits into at most two. Power-of-two sizes are what make this so cheap.
  - id: s06
    title: When a chain becomes a tree
    narration: >-
      What if one bucket still fills up? 8 keys in one locker? Then Java changes the bucket
      itself. Add a key to a bucket that already holds eight, and the chain becomes a red-black
      tree. But only once the table has 64 buckets. A smaller table just doubles instead. A
      balanced tree finds a key in a few hops, O(log n), instead of walking the whole chain. Why
      8, though? With random hash codes and this load factor, the JDK's own notes put the chance
      of eight keys in one bucket at about six in a hundred million. Most buckets hold zero or one
      key. And tree nodes are about twice the size of normal ones. So a tree only pays off when
      something is wrong: a weak hashCode, or an attack. How do you sort keys in a tree when
      they're all in one bucket? By hash first. When hashes tie, by compareTo, if the keys are
      Comparable, like Strings. And when a resize leaves a tree with 6 nodes or fewer, it turns
      back into a chain.
  - id: s07
    title: The 2011 hash flood
    narration: >-
      Now, back to 2011. The two researchers presented the attack at the Chaos Communication
      Congress in Germany. Web servers put every form field of a request into a hash map. Field
      names are strings. And string hash codes are easy to collide on purpose. Look. "Aa" and
      "BB" have the same hashCode: 2112. Glue pairs of them together, and every combination
      collides too. Line 2 starts each round. Lines 5 and 6 add both pairs to every key so far.
      14 rounds make 16,384 keys, all with one hash. So every field lands in the same bucket! One
      giant chain. Each new field walks the whole chain before it's added. Twice the fields, four
      times the work. That's how one request held a CPU for hours. The fix came in two parts.
      Servers capped how many parameters one request may carry. Tomcat's default today is 10,000.
      And Java 8 brought tree buckets. Strings are Comparable, so even one giant bucket costs a
      few hops per key, not the whole chain.
  - id: s08
    title: Four rules, in code
    narration: >-
      So HashMap is perfect now? It's fast, if you follow four rules. Each one has broken real
      production code. So let's break each one, and fix it, in code. Rule one: a key must never
      change. Here the key is a user, and line three builds her hash code from her email. Line six
      puts Ana in the map. Line seven changes her email, and with it her hash. So line eight looks
      in bucket eight. Her entry still sits in bucket three. Get returns null, and the entry leaks.
      So how do I make a key that can't change? Make the key a record. Its fields are final, and
      Java writes equals and hash code from them. Line four won't even compile now. To change her
      email, lines five and six remove the old key and put a new one, on purpose. Rule two: HashMap
      is not thread-safe. This code counts orders from a hundred thousand tasks, on virtual threads,
      all at once. Line two is a merge: read the count, add one, write it back. Two threads read 41.
      Both write 42. One order is gone. So the total comes out short? We ran it three times and got
      three different totals, every one short. And a resize racing a write can lose whole entries.
      The fix is one word on line one: ConcurrentHashMap. Its merge is atomic for each key, so line
      six prints 100,000, every time. It stays fast because it locks small. An empty bucket is
      claimed with one compare-and-swap. A busy bucket locks only itself, and every other bucket
      keeps working. Rule three? Order. Put ana, tom, kai and zoe, and HashMap hands them back as
      zoe, kai, tom, ana. It walks the table bucket by bucket, and a resize can shuffle it again.
      LinkedHashMap also links every entry onto a list, in the order you put it. Line eight prints
      them back exactly as they went in. Flip one switch, and it becomes a cache. This is a complete
      least recently used cache, in eight lines. Line three passes true: access order. Now every get
      moves an entry to the end of the list. And line six is the whole policy. When the size passes
      the limit, the eldest entry goes. Watch. A cache of three holds ana, bo and leo. Get ana, and
      she moves to the end. Put dee, and bo, the one used longest ago, is dropped. And the last
      rule? Size it right. new HashMap<>(100) is a capacity: 128 buckets. Entry 97 doubles the
      table, and moves every entry. Line three is the fix, since Java 19. HashMap.newHashMap(100)
      does the math: 256 buckets, so 100 entries fit with no resize. And memory? Every entry is a
      node object: a hash, a key, a value and a pointer to the next node. For millions of tiny
      entries, that overhead adds up.
  - id: s09
    title: Recap and what's next
    narration: >-
      Recap. The hash code picks a bucket in one jump. Collisions form a short chain, checked by
      hash, then by equals. At three quarters full, the table doubles, and each chain splits by
      one bit. A crowded bucket in a big table becomes a tree. And that tree is what stopped the
      2011 flood. What's next? Saturday: how Postgres lets readers and writers work at the same
      time without waiting for each other. It's called MVCC. See you there!

