  id:
    title: "Outbox Pattern: kenapa event kamu hilang"
    description: "Pembayaran tersimpan, tapi event tidak pernah terkirim. Kenapa menulis ke database dan message broker secara terpisah (dual write) gagal, dan bagaimana outbox pattern memperbaikinya dengan satu transaksi, lengkap dengan kode Java baris demi baris."
  vi:
    title: "Outbox Pattern: vì sao sự kiện của bạn biến mất"
    description: "Thanh toán đã lưu, nhưng sự kiện không bao giờ được gửi. Vì sao ghi riêng vào cơ sở dữ liệu và message broker (dual write) lại hỏng, và outbox pattern sửa nó bằng một giao dịch duy nhất như thế nào, kèm mã Java từng dòng."
  ar:
    title: "نمط Outbox: لماذا تضيع أحداثك"
    description: "تم حفظ الدفع، لكن الحدث لم يُرسل أبدًا. لماذا تفشل الكتابة المنفصلة في قاعدة البيانات ووسيط الرسائل (dual write)، وكيف يصلح نمط outbox ذلك بمعاملة واحدة، مع شرح كود Java سطرًا بسطر."

