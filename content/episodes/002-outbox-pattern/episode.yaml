fact_check:
  - claim: "Publishing first leaves an event with no matching database update; reordering two writes cannot make them atomic"
    source: https://www.confluent.io/blog/dual-write-problem/
  - claim: "A database transaction covers the database and does not usually extend to Kafka"
    source: https://www.confluent.io/blog/dual-write-problem/
  - claim: "With an outbox, messages are sent if and only if the database transaction commits; the relay can publish a message more than once, so consumers must be idempotent"
    source: https://microservices.io/patterns/data/transactional-outbox.html
  - claim: "New JDBC connections are in auto-commit mode; with auto-commit off, statements form a transaction ended by commit or rollback"
    source: https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/Connection.html
  - claim: "SKIP LOCKED skips rows that cannot be locked immediately, avoiding contention with multiple consumers of a queue-like table"
    source: https://www.postgresql.org/docs/current/sql-select.html
  - claim: "PostgreSQL logs changes in the write-ahead log before writing data files, and uses the log for crash recovery"
    source: https://www.postgresql.org/docs/current/wal-intro.html
  - claim: "Debezium's outbox event router turns rows of an outbox table into messages, keyed by the aggregate id"
    source: https://debezium.io/documentation/reference/stable/transformations/outbox-event-router.html
  - claim: "Kafka writes events with the same key to the same partition and consumers read a partition in the order written"
    source: https://kafka.apache.org/intro
  - claim: "Netflix (2019) found issues with dual writes, log tables and distributed transactions, built Delta to read changes from transaction logs through Kafka, and traces messages because events can still be lost in extreme situations"
    source: https://www.infoq.com/news/2019/11/data-synchronization-netflix
  - claim: "The consumer applies an event once by recording (consumer, event id) under a primary key in the same transaction as the effect"
    source: "derived from code sample samples/java/payments/LedgerConsumer.java"

