fact_check:
  - claim: "Three layers each retrying four times give 64 attempts for one user action"
    source: https://sre.google/sre-book/addressing-cascading-failures/
  - claim: "Retrying independently at every layer of a five-layer stack increases database load 243 times"
    source: https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter
  - claim: "Jitter adds randomness to backoff to spread retries; full jitter did the least work of the approaches compared"
    source: https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/
  - claim: "A token bucket lets calls retry while there are tokens, then at a fixed rate"
    source: https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter
  - claim: "Use randomized exponential backoff, limit retries, consider a retry budget, and propagate deadlines"
    source: https://sre.google/sre-book/addressing-cascading-failures/
  - claim: "APIs with side effects aren't safe to retry unless they provide idempotency"
    source: https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter
  - claim: "Retry-After tells a client how long to wait before a follow-up request"
    source: https://www.rfc-editor.org/rfc/rfc9110#field.retry-after
  - claim: "On 7 December 2021 an automated scaling activity triggered a client surge in us-east-1; failures led to more connection attempts and retries; a latent issue stopped clients backing off; network devices recovered at 2:22 PM PST"
    source: https://aws.amazon.com/message/12721/
  - claim: "Ten additions of 0.1 in floating point give 0.9999999999999999, so the budget counts whole tenths"
    source: "derived from code sample samples/node/budget.mjs (samples.test.mjs)"

