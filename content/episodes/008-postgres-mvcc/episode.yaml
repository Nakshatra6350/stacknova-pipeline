fact_check:
  - claim: "Each statement sees a snapshot of the data; reading never blocks writing and writing never blocks reading"
    source: https://www.postgresql.org/docs/18/mvcc-intro.html
  - claim: "Read Committed is the default; each statement sees data committed before it began; Repeatable Read sees data as of the start of the transaction's first statement"
    source: https://www.postgresql.org/docs/18/transaction-iso.html
  - claim: "Under Read Committed, an UPDATE of a row being updated by another transaction waits for that transaction to commit or roll back"
    source: https://www.postgresql.org/docs/18/transaction-iso.html
  - claim: "xmin is the inserting transaction, xmax the deleting (or locking) transaction or zero, ctid the physical location of the row version"
    source: https://www.postgresql.org/docs/18/ddl-system-columns.html
  - claim: "A snapshot is stored as xmin, xmax and the list of transactions in progress (pg_current_snapshot); work of transactions in progress at snapshot time is invisible"
    source: https://www.postgresql.org/docs/18/functions-info.html
  - claim: "An UPDATE or DELETE does not immediately remove the old row version; VACUUM reclaims it once no transaction can still see it; plain VACUUM makes space reusable without returning it to the OS in general, VACUUM FULL rewrites the table and takes an exclusive lock"
    source: https://www.postgresql.org/docs/18/routine-vacuuming.html
  - claim: "Autovacuum vacuums a table after 50 + 20% of its rows changed (autovacuum_vacuum_threshold, autovacuum_vacuum_scale_factor defaults) and forces a freeze at autovacuum_freeze_max_age, 200 million by default"
    source: https://www.postgresql.org/docs/18/runtime-config-autovacuum.html
  - claim: "Transaction IDs are 32 bits, compared modulo 2^32 (about two billion older, two billion newer); old rows must be frozen; the server refuses to assign new XIDs once fewer than three million remain, and only read-only transactions can start"
    source: https://www.postgresql.org/docs/18/routine-vacuuming.html
  - claim: "Long-running transactions, prepared transactions and replication slots hold back the cleanup horizon"
    source: https://www.postgresql.org/docs/18/routine-vacuuming.html
  - claim: "idle_in_transaction_session_timeout terminates sessions idle within an open transaction longer than the setting"
    source: https://www.postgresql.org/docs/18/runtime-config-client.html
  - claim: "pg_stat_activity shows each session's state (such as 'idle in transaction') and xact_start"
    source: https://www.postgresql.org/docs/18/monitoring-stats.html
  - claim: "A HOT update needs no new index entries when no indexed column changes and the page has room; lowering fillfactor makes room"
    source: https://www.postgresql.org/docs/18/storage-hot.html
  - claim: "The tuple header stores t_xmin and t_xmax as 32-bit transaction IDs"
    source: https://www.postgresql.org/docs/18/storage-page-layout.html
  - claim: "Mandrill (Mailchimp), 4-5 February 2019: a Postgres shard reached its XID limit and stopped accepting writes; its autovacuum likely fell behind or failed; a standalone VACUUM was estimated at up to 40 days; truncating two large tables freed the XIDs and the vacuum finished about an hour later; sending was impaired for about 40 hours; XID alerting was added"
    source: https://mailchimp.com/en-gb/what-we-learned-from-the-recent-mandrill-outage/
  - claim: "Sentry was hit by transaction ID wraparound protection on 20 July 2015"
    source: https://blog.sentry.io/transaction-id-wraparound-in-postgres
  - claim: "InnoDB keeps old row versions in undo tablespaces (a rollback segment)"
    source: https://dev.mysql.com/doc/refman/8.4/en/innodb-multi-versioning.html
  - claim: "A read on another connection during an uncommitted UPDATE returns the old value without waiting; after the commit, a new statement sees the new value"
    source: "derived from code sample samples/go/mvcc.go"

