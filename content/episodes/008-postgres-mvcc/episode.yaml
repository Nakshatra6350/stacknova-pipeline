# Episode 008 — how Postgres lets readers and writers work at the same time (MVCC): row versions,
# snapshots, VACUUM, bloat, and transaction ID wraparound, with Mailchimp's Mandrill outage of
# February 2019 as the story. A 3D film (studio/films/008-long) in the row vault: five rows, each
# slab a row version. The segments below carry the same words, for the chapters, the subtitles
# and the fact check. Out Saturday 31 October 2026; three Shorts lead into it (Wednesday 28 to
# Friday 30 October), the flagship reel goes out the same day, part 4 on Sunday 1 November.
