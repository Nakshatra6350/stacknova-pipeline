shorts:
  - id: short-1
    source: standalone
    film: studio/films/008-p1
    hook_on_screen: "WHO WAITS FOR AN UPDATE?"
    script: >-
      I'm updating Ana's balance. Shouldn't every reader have to wait until I'm done? Not in
      Postgres. Your update doesn't change the row. It writes a new version of it. A new version?
      Then which one does a reader see? The one its snapshot allows. Every row version carries the
      ID of the transaction that wrote it. Yours hasn't committed yet, so everyone else still
      reads the old version, with the old balance. So nobody waits for me? Readers never block
      writers, and writers never block readers. That's MVCC: multi-version concurrency control.
      And when I commit? New snapshots see your version. The old one stays behind for a while.
      Part 2: where it goes.
    youtube_title: "Why Postgres Readers Never Wait for Writers (MVCC) #Shorts"
    instagram_caption: |
      An UPDATE in Postgres doesn't change the row: it writes a new version. Readers keep seeing the
      old one until you commit. 🧩
    pillar_hashtags: database-internals
  - id: short-2
    source: standalone
    film: studio/films/008-p2
    hook_on_screen: "ONE ROW. TWO VERSIONS."
    script: >-
      I updated one row. Why does the table now hold two? Because in Postgres, an update is really
      an insert plus a delete. The old version gets an xmax: the transaction that replaced it. The
      new version gets an xmin: the transaction that wrote it. Can I see that? Ask for the hidden
      columns: xmin, xmax, and ctid, the row's physical address. Update the row, and its ctid
      moves. So the old row is just... dead? Dead, but still on disk, until no transaction can see
      it. Then VACUUM takes the space back. And if VACUUM can't clean it? Then your table keeps
      growing. Part 3: the idle transaction that stops the cleanup.
    youtube_title: "A Postgres UPDATE Is Really INSERT + DELETE #Shorts"
    instagram_caption: |
      One UPDATE, two row versions: the old one gets an xmax, the new one an xmin. SELECT xmin,
      xmax, ctid to see them. 🔍
    pillar_hashtags: database-internals
  - id: short-3
    source: standalone
    film: studio/films/008-p3
    hook_on_screen: "DELETED. STILL GROWING."
    script: >-
      Our orders table keeps growing, and we delete old orders every night! Deleted rows don't
      disappear. They become dead versions, waiting for VACUUM. Then why isn't VACUUM cleaning
      them? Because someone might still need them. VACUUM only removes versions that no open
      transaction can see. Look. A session began a transaction an hour ago, and went idle. Its
      snapshot is still open. One idle connection holds up the whole cleanup? Every version that
      snapshot might still need has to stay. The table bloats, and every scan wades through the
      dead rows. How do I catch it? Look in pg_stat_activity for sessions idle in transaction. And
      set idle_in_transaction_session_timeout, so Postgres ends them for you. Part 4: the day a
      database stopped accepting writes.
    youtube_title: "One Idle Transaction Can Bloat Your Postgres Table #Shorts"
    instagram_caption: |
      Deleted rows stay as dead versions until no open snapshot can need them. One session idle in
      a transaction holds up VACUUM for the whole table. 🐘
    pillar_hashtags: database-internals
  - id: short-4
    source: standalone
    film: studio/films/008-p4
    hook_on_screen: "POSTGRES STOPPED WRITING"
    script: >-
      The database says it's not accepting commands. We didn't change anything! You're running
      out of transaction IDs. In Postgres, they're only 32 bits. 32 bits? That's 4 billion! And
      Postgres compares them on a circle: about 2 billion in the past, 2 billion in the future. So
      old rows must be frozen, marked older than everything, before the counter comes back
      around. That's VACUUM's job too. And if VACUUM falls behind? Postgres warns you. Then, 3
      million IDs before the edge, it stops starting transactions that write. Only reads keep
      working. How do I see it coming? Watch age(datfrozenxid) for every database. Autovacuum
      freezes long before the limit. Your job is to make sure it can finish. The full MVCC deep
      dive is on our channel now.
    youtube_title: "Postgres Stops Accepting Writes: XID Wraparound #Shorts"
    instagram_caption: |
      32-bit transaction IDs on a circle: if VACUUM can't freeze old rows in time, Postgres stops
      starting writes. Watch age(datfrozenxid). ⏳
    pillar_hashtags: database-internals
  - id: short-5
    source: standalone
    film: studio/films/008-reel
    hook_on_screen: "WRITES STOPPED. 40 HOURS."
    script: >-
      Emails stopped going out. For hours! The database won't take a single write! February 2019.
      Mailchimp's email service, Mandrill. One Postgres shard stopped accepting writes. Why? Was
      the disk full? It ran out of transaction IDs. Postgres uses 32-bit IDs, and it must freeze
      old rows before the counter wraps around. That shard was busier than the others. Its
      autovacuum fell behind, or failed. They never found out which. So they just run VACUUM? They
      tried. Vacuuming that database by hand was estimated to take up to 40 days. 40 days?! So
      they emptied two huge tables to free the IDs. Then the vacuum finished in about an hour. How
      long were emails stuck? Sending was impaired for about 40 hours. How do we never let that
      happen? Alert on transaction ID age, long before the limit, and make sure every vacuum can
      finish. The full MVCC deep dive is on our channel.
    youtube_title: "The Postgres Outage a 40-Day VACUUM Couldn't Fix #Shorts"
    instagram_caption: |
      February 2019: Mandrill's Postgres ran out of transaction IDs and stopped accepting writes.
      The VACUUM estimate: up to 40 days. 📉
    pillar_hashtags: database-internals

