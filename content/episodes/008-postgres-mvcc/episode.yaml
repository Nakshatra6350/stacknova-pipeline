  description: |
    In February 2019 a Postgres database stopped accepting writes, and the fix it asked for was
    estimated at up to 40 days. Here is the machinery behind it: MVCC. Row versions stamped with
    xmin and xmax, snapshots and visibility, Read Committed vs Repeatable Read, dead rows and
    VACUUM, the idle transaction that bloats a table, transaction ID wraparound and freezing, and
    what MVCC costs. Four walkthroughs of real Go code (pgx), line by line.

