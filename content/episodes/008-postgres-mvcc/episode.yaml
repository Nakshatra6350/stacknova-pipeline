segments:
  - id: s01
    title: The database that refused every write
    narration: >-
      February 2019. An email service stopped sending for nearly two days. The database wasn't
      down. It simply refused every write. Refused? A healthy database? Healthy, and protecting
      itself. And the fix it asked for was estimated to take 40 days. 40 days?! What could do
      that? The same machinery that lets Postgres read and write at the same time. Let's open it
      up. Every digital frontier begins with an idea. What brings it to life is the engineering
      beneath it. Welcome to StackNova — exploring the architecture of tomorrow, one system at a
      time.
  - id: s02
    title: One copy and a lock?
    narration: >-
      I'd guess Postgres keeps one copy of each row, and locks it while someone changes it.
      That's what most people picture. A writer locks the row, and every reader waits. Then a
      long report would freeze every checkout, and every checkout would freeze the report. So
      what does it do instead? It keeps more than one version of a row, and lets each reader see
      the right one.
  - id: s03
    title: A read that never waits
    narration: >-
      Here's the proof, in Go, with the pgx driver. Line 1 opens a transaction: the writer. Line
      2 changes Ana's balance from 100 to 70. It isn't committed yet. Line 4 reads the same row
      on another connection. It doesn't wait. It gets 100: the old version. Line 6 commits. And
      line 7 reads again: 70. A new statement, a new snapshot. Two versions of the same row, at
      the same time? Exactly. The update didn't change the row. It wrote a new version, and left
      the old one for anyone still looking. Where does the old version live? Right beside the
      new one, in the same table. Some databases, like MySQL's InnoDB, move old versions to an
      undo log instead. Postgres keeps them in place.
  - id: s04
    title: Snapshots and stamps
    narration: >-
      Every version carries two stamps. xmin: the transaction that wrote it. xmax: the
      transaction that replaced or deleted it. A snapshot says which transactions a statement
      may see. A version is visible when its xmin committed before the snapshot, and its xmax
      didn't. Postgres stores a snapshot as a range of transaction IDs, plus the ones still
      running when it was taken. Anything still running is invisible, even if it commits a
      moment later. At Read Committed, the default, every statement takes a new snapshot. At
      Repeatable Read, the whole transaction keeps its first one. So a report at Repeatable Read
      sees every balance as of its first query, even if hundreds of payments commit while it
      runs. Can I see those stamps? Ask for them. This query selects xmin, xmax, and ctid: where
      the version sits on disk. Run it, update the row, and run it again. A new xmin, and a new
      ctid. The old version is still on the page, just not visible to you.
  - id: s05
    title: Dead rows, VACUUM and bloat
    narration: >-
      And the old versions? Do they stay forever? Until no snapshot can see them. Then they're
      dead, and VACUUM takes the space back. Autovacuum does it for you, table by table. It
      wakes up when enough rows have died: by default, 50, plus a fifth of the table. And it
      doesn't shrink the file. It marks the space free for new rows. VACUUM FULL rewrites the
      table smaller, but it locks the table while it does. But one open transaction can hold all
      of it back. If a session starts a transaction and goes idle, its snapshot stays open.
      Every version it might still need has to stay. The table bloats, and scans wade through
      dead rows. Old replication slots and forgotten prepared transactions hold cleanup back the
      same way. So look for it. This query lists the sessions that are idle inside a
      transaction. Line 3 turns how long the transaction has been open into seconds. Line 5
      keeps only the idle ones. And Postgres can end them for you: set
      idle_in_transaction_session_timeout. And if I need the disk space back right away? Then
      schedule VACUUM FULL for a quiet moment. It blocks every read and write on that table
      until it's done.
  - id: s06
    title: "Wraparound: the Mandrill outage"
    narration: >-
      VACUUM has a second job, and that's where the outage came from. Transaction IDs are 32
      bits. Postgres compares them on a circle: about 2 billion in the past, 2 billion in the
      future. Before the counter comes back around, every old row must be frozen: marked older
      than everything. VACUUM does that too. Autovacuum forces a freezing pass on any table
      whose oldest unfrozen ID is 200 million transactions old. That's the default, and it
      leaves plenty of room. And if VACUUM falls behind? Postgres warns you. Then, 3 million IDs
      before the edge, it stops starting any transaction that writes. Can't it just use bigger
      IDs? Not today. Every row version stores its IDs in 32 bits, so freezing is the way out,
      and your monitoring is the safety net. That's what hit Mailchimp's Mandrill on 4 February
      2019. One shard was busier than the rest, and its autovacuum fell behind, or failed. A
      full VACUUM was estimated at up to 40 days. So they emptied two huge tables to free the
      IDs, and the vacuum finished in about an hour. Sending was impaired for about 40 hours.
      Sentry hit the same wall in July 2015. Both added alerts afterwards. Here's yours. Line 2
      asks every database for the age of its oldest unfrozen transaction ID. Line 5 raises the
      alarm at your limit, say a billion, long before the edge.
  - id: s07
    title: What MVCC costs
    narration: >-
      So MVCC is free speed? It's a trade. Readers never block writers, and writers never block
      readers. Every statement sees a consistent snapshot. One thing it doesn't remove: two
      writers changing the same row still take turns. The second waits for the first to commit
      or roll back. The cost: every update writes a whole new version, and usually new index
      entries too. Dead versions take space until VACUUM runs. Postgres softens that with heap-
      only tuples. When no indexed column changes and the page has room, the indexes don't need
      a new entry. Lower a table's fillfactor to leave room on each page, and more updates
      qualify. Your part: keep transactions short, never leave a session idle inside one, and
      watch VACUUM and transaction ID age.
  - id: s08
    title: Recap and what's next
    narration: >-
      Recap. An update writes a new version, stamped with xmin and xmax. Each statement reads
      through a snapshot, so readers never wait. VACUUM removes versions nobody can see, and
      freezes old rows before the IDs wrap around. Let it finish, and Postgres never stops.
      What's next? A new deep dive every Tuesday and Saturday. Follow, so you don't miss it. See
      you there!

