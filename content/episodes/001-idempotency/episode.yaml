        - {id: ahead, kind: list, title: "in the next few minutes", unit: parts, empty: "Three things to see.", lane: api}
      steps:
        - {at: "tapped Pay", action: tap, target: phone}
        - at: "tapped Pay"
          action: send
          target: "phone->gateway"
          params:
            delay: 0.1
            label: "POST /payments"
            wire:
              title: "Create payment"
              method: POST
              path: /v1/payments
              headers: {Content-Type: application/json}
              body: {amount: 100, currency: USD, source: card_visa_4242}
        - {at: "tapped Pay", action: log, target: api, params: {delay: 0.6, text: "POST /payments → charge $100"}}
        - {at: "The spinner", action: log, target: gateway, params: {text: "charge #1 $100 ok"}}
        - {at: "The spinner", action: item, target: statement, params: {delay: 0.1, text: "#1 · card payment", value: "$100.00"}}
        - at: "The spinner"
