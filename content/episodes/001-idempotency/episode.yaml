fact_check:
  - claim: "GET, PUT and DELETE are defined as idempotent; POST is not"
    source: https://www.rfc-editor.org/rfc/rfc9110#section-9.2.2
  - claim: "Stripe documents an Idempotency-Key header and keeps keys at least 24 hours"
    source: https://docs.stripe.com/api/idempotent_requests
  - claim: "Stripe compares parameters on key reuse and errors if they differ"
    source: https://docs.stripe.com/api/idempotent_requests
  - claim: "A unique constraint makes the second concurrent insert fail"
    source: "derived from code sample samples/go/idempotency.go (ON CONFLICT DO NOTHING → 0 rows)"
  - claim: "Go 1.27 added a uuid package to the standard library"
    source: https://go.dev/doc/go1.27
  - claim: "uuid.NewV4 returns a random (version 4) UUID with 122 random bits"
    source: https://pkg.go.dev/uuid#NewV4
  - claim: "Client.Do returns an error only when no usable answer came back; a non-2xx status is not an error"
    source: https://pkg.go.dev/net/http#Client.Do
  - claim: "A request body that was sent has been read (the Transport closes it), so each attempt builds its request again"
    source: https://pkg.go.dev/net/http#Client.Do
  - claim: "The naive handler charges on every request; the replay answers 422, 409 or the saved response"
    source: "derived from code samples samples/go/naive.go and samples/go/idempotency.go"

