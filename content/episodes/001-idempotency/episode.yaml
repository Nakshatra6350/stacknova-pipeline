  - id: s02
    title: Silence has three causes
    narration: >-
      Here's how most of us picture an API call. The client sends a request, the server does the
      work, the server sends a response. If anything fails, the client retries. Clean. But that
      picture hides a question: when the client gets no response, what actually happened? There are
      three possibilities. One: the request never reached the server, so a retry is safe. Two: the
      server received it and crashed before changing anything. Also safe. Three: the server did the
      work, it charged the card, and the response got lost on the way back. A timeout, a dropped
      connection, a load balancer restart. From the client's side, all three look identical:
      silence. That's not a bug in your code. It's a property of networks. And in case three, a
      retry means a second charge.
    emphasis: [three possibilities, silence, second charge]
    visual:
      # Scene 1: the picture most of us carry. Request, work, response.
      - layout: console
        phone:
          title: Checkout
          total: "$100.00"
          method: "Visa •••• 4242"
          items: [["Headphones", "$89.00"], ["Shipping", "$11.00"]]
        systems:
          - {id: api, name: "API server", sub: "POST /v1/payments", idle: "listening on :8080"}
          - {id: gateway, name: "Payment gateway", sub: "moves the money"}
        panels:
          - {id: charges, kind: list, title: "gateway · charges", unit: charged, empty: "No money has moved.", lane: gateway}
        steps:
          - {at: "The client sends a request", action: tap, target: phone}
          - at: "The client sends a request"
            action: send
            target: "phone->api"
            params:
              delay: 0.1
              label: "POST /payments"
              wire:
                title: "Create payment"
                method: POST
                path: /v1/payments
                headers: {Content-Type: application/json}
                body: {amount: 100, currency: USD, source: card_visa_4242}
          - {at: "the server does the work", action: log, target: api, params: {text: "POST /payments → charge $100"}}
          - {at: "the server does the work", action: send, target: "api->gateway", params: {delay: 0.1, label: "charge $100"}}
          - {at: "the server does the work", action: item, target: charges, params: {delay: 0.65, text: "#1 pay_A19", value: "$100.00"}}
          - {at: "the server does the work", action: log, target: gateway, params: {delay: 0.65, text: "charge #1 $100 ok"}}
          - at: "the server sends a response"
            action: send
            target: "gateway->phone"
            params: {label: "201 Created", role: reply, response: {status: "201 Created", body: {id: pay_A19, status: succeeded}}}
          - {at: "the server sends a response", action: screen, target: phone, params: {delay: 0.9, state: success, text: "$100.00 · receipt #A19", attempt: "paid"}}
          - {at: "the client retries", action: note, target: wire, params: {text: "And if anything fails? The client just retries."}}
          - {at: "Clean", action: stamp, target: charges, params: {text: "CLEAN", status: ok}}
      # Scene 2: the same call with no response. Three stories the client cannot tell apart.
      - layout: console
        from: "But that picture"
        phone:
          title: Checkout
          total: "$100.00"
          method: "Visa •••• 4242"
          items: [["Headphones", "$89.00"], ["Shipping", "$11.00"]]
        systems:
          - {id: api, name: "API server", sub: "POST /v1/payments", idle: "listening on :8080"}
          - {id: gateway, name: "Payment gateway", sub: "moves the money"}
        panels:
