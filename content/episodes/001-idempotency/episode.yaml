  - id: s03
    title: Retries are guaranteed
    narration: >-
      So why not just never retry? Because then cases one and two become lost payments. And
      retries happen whether you write them or not. Your HTTP client may retry. Your service mesh
      may retry. The mobile app retries when the network switches from Wi-Fi to mobile data. The
      user retries by tapping the button again. A message queue redelivers a message when the
      consumer doesn't acknowledge it in time. In a distributed system, assume every request can
      arrive more than once. That's called at-least-once delivery. So the real question isn't "how
      do I stop duplicates from arriving?" It's "how do I make a duplicate harmless?"
    emphasis: [at-least-once, harmless]
    visual:
      layout: fanin
      header: ["WHO RETRIES?", "EVERYONE"]
      sources:
        - {id: http, label: "HTTP client"}
        - {id: mesh, label: "service mesh"}
        - {id: app, label: "mobile app"}
        - {id: user, label: "the user"}
        - {id: queue, label: "message queue"}
      target: {id: api, label: "your service", title: api}
      counter: "copies of one request"
      steps:
        - {at: "never retry", action: tag, target: api, params: {text: "never retry?"}}
        - {at: "lost payments", action: badge, target: api, params: {text: "LOST PAYMENTS", status: bad}}
        - {at: "retries happen", action: tag, target: api, params: {text: "retries happen anyway"}}
        - {at: "Your HTTP client", action: fire, target: http}
        - {at: "Your service mesh", action: fire, target: mesh}
        - {at: "The mobile app retries", action: fire, target: app}
        - {at: "The user retries", action: fire, target: user}
        - {at: "A message queue redelivers", action: fire, target: queue}
        - {at: "assume every request", action: fire, target: http}
        - {at: "more than once", action: fire, target: user}
        - {at: "at-least-once delivery", action: badge, target: api, params: {text: "AT-LEAST-ONCE", status: info}}
        - {at: "stop duplicates", action: fire, target: mesh}
        - {at: "make a duplicate harmless", action: badge, target: api, params: {text: "MAKE IT HARMLESS", status: ok}}
        - {at: "make a duplicate harmless", action: highlight, target: api}

  - id: s04
    title: What idempotent means
    narration: >-
      That property has a name: idempotency. An operation is idempotent if doing it twice has the
      same effect as doing it once. Setting a user's email to a value is idempotent; do it ten
      times and you end in the same state. "Add a hundred dollars to this account" is not; do it
      twice and you've added two hundred. HTTP already defines GET, PUT and DELETE as idempotent.
      POST is not. And "create a payment" is almost always a POST, so we have to make it idempotent
      ourselves. Here's the handler most of us write first, in Go. It reads the body. Then it asks
      the gateway to charge the card. If that fails, it tells the client to try again; that's the
      message you saw at the start. If it works, it writes the gateway's answer back. Now look for
      the line that asks whether this payment was already made. There isn't one. Every request that
      reaches this handler charges the card, so two requests mean two charges.
    emphasis: [idempotency, twice, once, POST]
    visual:
      - layout: cards
        header: ["IDEMPOTENT?", "DO IT TWICE"]
        title: "twice has the same effect as once"
        cards:
          - id: set
            title: "SET email = x"
            lines: [{id: state, key: email, value: "old"}]
          - id: add
            title: "balance += 100"
            lines: [{id: state, key: balance, value: "$0"}]
        steps:
          - {at: "doing it twice", action: highlight, target: set}
          - {at: "doing it twice", action: highlight, target: add}
          - {at: "Setting a user's email", action: dim, target: add}
          - {at: "Setting a user's email", action: apply, target: set, params: {line: state, value: "x", status: ok}}
          - {at: "do it ten times", action: apply, target: set, params: {line: state, value: "x", status: ok}}
          - {at: "you end in", action: apply, target: set, params: {line: state, value: "x", status: ok}}
          - {at: "the same state", action: mark, target: set, params: {status: ok}}
          - {at: "the same state", action: badge, target: set, params: {text: IDEMPOTENT, status: ok}}
          - {at: "Add a hundred dollars", action: focus, target: add}
          - {at: "Add a hundred dollars", action: apply, target: add, params: {line: state, value: "$100"}}
          - {at: "do it twice and", action: apply, target: add, params: {line: state, value: "$200", status: bad}}
          - {at: "added two hundred", action: mark, target: add, params: {status: bad}}
          - {at: "added two hundred", action: badge, target: add, params: {text: "NOT IDEMPOTENT", status: bad}}
      - layout: cards
        from: "HTTP already defines"
        header: ["HTTP METHODS", "SAFE TO REPEAT?"]
        title: "what HTTP itself promises"
        cards:
          - {id: get, title: GET, text: "read"}
          - {id: put, title: PUT, text: "replace"}
          - {id: delete, title: DELETE, text: "remove"}
          - {id: post, title: POST, text: "create"}
        steps:
          - {at: "GET, PUT and DELETE", action: mark, target: get, params: {status: ok}}
          - {at: "PUT and DELETE", action: mark, target: put, params: {status: ok}}
          - {at: "DELETE as idempotent", action: mark, target: delete, params: {status: ok}}
          - {at: "POST is not", action: mark, target: post, params: {status: bad}}
          - {at: "create a payment", action: badge, target: post, params: {text: "create a payment", status: bad}}
          - {at: "make it idempotent ourselves", action: highlight, target: post}
      # Scene 3: the handler in code, line by line, and the check it does not have.
      - layout: code
        from: "Here's the handler most of us write first"
        header: ["IN CODE", "THE NAIVE HANDLER"]
        title: naive.go
        language: go
        reveal: true
        lines:
          - "func (s *NaiveServer) Pay(w http.ResponseWriter,"
          - "  r *http.Request) {"
          - "  body, _ := io.ReadAll(r.Body)"
          - "  resp, err := s.Gateway.Charge(r.Context(), body)"
          - "  if err != nil {"
          - '    http.Error(w, "try again", http.StatusBadGateway)'
          - "    return"
          - "  }"
          - "  w.Write(resp)"
          - "}"
        steps:
          - {at: "Here's the handler most of us write first", action: show, target: "1-2"}
          - {at: "It reads the body", action: show, target: "3"}
          - {at: "It reads the body", action: highlight, target: "3"}
          - {at: "asks the gateway to charge", action: show, target: "4"}
          - {at: "asks the gateway to charge", action: highlight, target: "4"}
          - {at: "If that fails", action: show, target: "5-8"}
          - {at: "If that fails", action: highlight, target: "5-8"}
          - {at: "the message you saw", action: note, target: "6", params: {text: "the error your phone showed", status: info}}
          - {at: "If it works", action: show, target: "9-10"}
          - {at: "If it works", action: highlight, target: "9"}
          - {at: "Now look for the line", action: focus, target: all}
          - {at: "There isn't one", action: highlight, target: "4"}
          - {at: "There isn't one", action: note, target: "4", params: {text: "charges on every request, even a retry", status: bad}}

  - id: s05
    title: The idempotency key
    narration: >-
      The standard fix is an idempotency key. Before the first attempt, the client generates a
      unique ID for this one operation, a random UUID is fine, and sends it in a header, commonly
      called Idempotency-Key. Every retry of the same payment sends the same key. A new payment
      gets a new key. On the server, before doing any work, we look the key up. Never seen it?
      Record it, do the work, and save the response next to the key. Seen it, and the work is
      finished? Don't charge again; return the saved response. To the client, the retry looks
      exactly like a successful first attempt. The duplicate became harmless. Here's the client
      side, in Go. The key is made once, before the loop. Since Go 1.27 the standard library has a
      uuid package, and NewV4 gives a random UUID. Inside the
      loop, the request is built again for every attempt, because a body that was sent once has
      been read. Every attempt sets the same key in the same header. If an answer comes back, any
      answer, the loop ends. Only silence, an error with no response, earns another try: wait one
      second, then two, and send the same key again. Move the first line into the loop, and every
      retry becomes a brand new payment.
    emphasis: [Idempotency-Key, same key, saved response]
    visual:
      - layout: console
        phone:
          title: Checkout
          total: "$100.00"
          method: "Visa •••• 4242"
          items: [["Headphones", "$89.00"], ["Shipping", "$11.00"]]
        systems:
          - {id: api, name: "API server", sub: "POST /v1/payments", idle: "listening on :8080"}
          - {id: store, name: "Key store", sub: "PostgreSQL · idempotency_keys", idle: "waiting"}
          - {id: gateway, name: "Payment gateway", sub: "moves the money"}
        panels:
          - {id: keys, kind: table, title: idempotency_keys, columns: [key, status, response], unique: key, lane: store}
          - {id: charges, kind: list, title: "gateway · charges", unit: charged, empty: "No money has moved.", lane: gateway}
        steps:
          - {at: "generates a unique ID", action: screen, target: phone, params: {chip: {label: Idempotency-Key, value: 7f3c-91ab-4e02}}}
          - {at: "generates a unique ID", action: note, target: wire, params: {text: "Before the first attempt, the client makes one random ID for this payment."}}
          - {at: "sends it in a header", action: tap, target: phone}
          - at: "sends it in a header"
            action: send
            target: "phone->api"
            params:
              delay: 0.1
              label: "POST /payments · key 7f3c"
              wire:
                title: "Create payment"
                method: POST
                path: /v1/payments
                headers: {Content-Type: application/json, Idempotency-Key: 7f3c-91ab-4e02}
                body: {amount: 100, currency: USD, source: card_visa_4242}
          - {at: "sends it in a header", action: log, target: api, params: {delay: 0.6, text: "POST /payments key=7f3c"}}
          - {at: "Every retry", action: highlight, target: phone}
          - {at: "Every retry", action: note, target: wire, params: {text: "The same payment always sends the same key. A new payment gets a new one."}}
          - {at: "we look the key up", action: send, target: "api->store", params: {label: "SELECT 7f3c"}}
          - {at: "we look the key up", action: highlight, target: keys}
          - {at: "Never seen it", action: log, target: store, params: {text: "SELECT 7f3c → 0 rows"}}
          - {at: "Record it", action: send, target: "api->store", params: {label: "INSERT 7f3c"}}
          - {at: "Record it", action: row, target: keys, params: {delay: 0.45, key: "7f3c-91ab…", cells: [in_progress, "—"], status: info}}
          - {at: "Record it", action: log, target: store, params: {delay: 0.45, text: "INSERT 7f3c → 1 row"}}
          - {at: "do the work", action: send, target: "api->gateway", params: {label: "charge $100"}}
          - {at: "do the work", action: item, target: charges, params: {delay: 0.6, text: "#1 pay_A19", value: "$100.00"}}
          - {at: "do the work", action: log, target: gateway, params: {delay: 0.6, text: "charge #1 $100 ok"}}
          - {at: "save the response", action: row, target: keys, params: {key: "7f3c-91ab…", cells: [completed, "201 pay_A19"], status: ok}}
          - {at: "save the response", action: log, target: store, params: {text: "UPDATE 7f3c → completed"}}
          - at: "save the response"
            action: send
            target: "gateway->phone"
            params: {delay: 0.4, label: "201 Created", role: reply, lost: 0.8, response: {status: "201 Created", body: {id: pay_A19, status: succeeded}}}
          - {at: "save the response", action: screen, target: phone, params: {delay: 1.5, state: error, text: "We could not confirm your payment. Try again.", attempt: "no reply"}}
          - {at: "Seen it", action: tap, target: phone}
          - at: "Seen it"
            action: send
            target: "phone->api"
            params:
              delay: 0.1
              label: "RETRY · key 7f3c"
              role: retry
              wire:
                title: "Create payment"
                tag: "RETRY · SAME KEY"
                method: POST
                path: /v1/payments
                headers: {Content-Type: application/json, Idempotency-Key: 7f3c-91ab-4e02}
                body: {amount: 100, currency: USD, source: card_visa_4242}
          - {at: "Seen it", action: send, target: "api->store", params: {delay: 0.7, label: "SELECT 7f3c"}}
          - {at: "the work is finished", action: log, target: store, params: {text: "SELECT 7f3c → completed"}}
          - {at: "the work is finished", action: highlight, target: keys}
          - {at: "Don't charge again", action: log, target: api, params: {text: "key exists → skip charge"}}
          - {at: "Don't charge again", action: note, target: wire, params: {text: "No second charge: the key is already there, with its answer.", status: ok}}
          - {at: "return the saved response", action: send, target: "store->api", params: {label: "saved 201", role: reply}}
          - at: "return the saved response"
            action: send
            target: "api->phone"
            params: {delay: 0.5, label: "201 · replayed", role: reply, response: {status: "201 Created · replayed", body: {id: pay_A19, status: succeeded}}}
          - {at: "return the saved response", action: screen, target: phone, params: {delay: 1.05, state: success, text: "$100.00 · receipt #A19", attempt: "paid"}}
          - {at: "successful first attempt", action: highlight, target: phone}
          - {at: "became harmless", action: stamp, target: charges, params: {text: "CHARGED ONCE", status: ok}}
          - {at: "became harmless", action: highlight, target: charges}
      # Scene 2: the client in code. One key before the loop, the same key on every attempt.
      - layout: code
        from: "Here's the client"
        header: ["IN CODE", "ONE KEY, EVERY RETRY"]
        title: client.go
        language: go
        reveal: true
        lines:
          - "key := uuid.NewV4().String() // once, before the first try"
          - "for attempt := 0; ; attempt++ {"
          - '  req, _ := http.NewRequest("POST", url, bytes.NewReader(b))'
          - '  req.Header.Set("Idempotency-Key", key)'
          - "  resp, err := c.Do(req)"
          - "  if err == nil || attempt == 2 {"
          - "    return resp, err // an answer, or out of tries"
          - "  }"
          - "  time.Sleep(time.Second << attempt) // 1 s, then 2 s"
          - "}"
        steps:
          - {at: "Here's the client", action: show, target: "1"}
          - {at: "made once, before the loop", action: highlight, target: "1"}
          - {at: "a random UUID", action: note, target: "1", params: {text: "uuid.NewV4: 122 random bits (Go 1.27)", status: info}}
          - {at: "Inside the", action: show, target: "2-3"}
          - {at: "built again for every attempt", action: highlight, target: "3"}
          - {at: "has been read", action: note, target: "3", params: {text: "a sent body is used up: build it again", status: info}}
          - {at: "sets the same key", action: show, target: "4"}
          - {at: "sets the same key", action: highlight, target: "4"}
          - {at: "If an answer comes back", action: show, target: "5-8"}
          - {at: "If an answer comes back", action: highlight, target: "5-7"}
          - {at: "Only silence", action: note, target: "6", params: {text: "err: no answer came back at all", status: info}}
          - {at: "wait one", action: show, target: "9-10"}
          - {at: "wait one", action: highlight, target: "9"}
          - {at: "send the same key again", action: highlight, target: "4"}
          - {at: "Move the first line", action: highlight, target: "1"}
          - {at: "brand new payment", action: note, target: "1", params: {text: "inside the loop: a new key, a new charge", status: bad}}

  - id: s06
    title: The race most tutorials miss
    narration: >-
      Most tutorials stop there. It isn't enough. Imagine the first request is still running, the
      card network is slow, when the retry arrives. Both requests check the table. Neither finds a
      finished entry. Both charge. We're back to two charges, just faster. The fix is to let the
      database decide who wins. Make the key a primary key, or give it a unique constraint. The
      first request inserts a row marked "in progress". The second request tries to insert the
      same key, and the database refuses. Now the second request knows someone else owns this
      operation. It must not charge, and it shouldn't hang. The usual answer is a 409 Conflict that
      tells the client to retry later. When the first request finishes, its row moves to
      "completed" with the stored response, and every later retry gets that response back.
    emphasis: [Both charge, database decide, unique constraint, 409 Conflict]
    visual:
      # Scene 1: check, then charge. Both requests pass the check.
      - layout: sequence
        header: ["THE RACE", "CHECK, THEN CHARGE"]
        actors:
          - {id: r1, label: "request #1", kind: client}
          - {id: db, label: "keys table", kind: store}
          - {id: r2, label: "the retry", kind: client}
        steps:
          - {at: "first request is still running", action: message, target: "r1->db", params: {text: "seen 7f3c?"}}
          - {at: "the card network is slow", action: message, target: "db->r1", params: {text: "no", role: reply}}
          - {at: "the retry arrives", action: highlight, target: r2}
          - {at: "Both requests check", action: message, target: "r2->db", params: {text: "seen 7f3c?", role: retry}}
          - {at: "Neither finds", action: message, target: "db->r2", params: {text: "no", role: reply}}
          - {at: "Both charge", action: note, target: r1, params: {text: "charge $100", status: bad}}
          - {at: "Both charge", action: note, target: r2, params: {text: "charge $100", status: bad, same_row: true}}
          - {at: "two charges", action: badge, target: db, params: {text: "TWO CHARGES", status: bad}}
      # Scene 2: the constraint that lets the database pick one winner.
      - layout: code
        from: "The fix is to let"
        header: ["THE FIX", "LET THE DATABASE DECIDE"]
        title: claim_key.sql
        language: sql
        reveal: true
        lines:
          - "CREATE TABLE idempotency_keys ("
          - "  key      text PRIMARY KEY,"
          - "  status   text NOT NULL,"
          - "  response jsonb"
          - ");"
          - ""
          - "INSERT INTO idempotency_keys (key, status)"
          - "VALUES ($1, 'in_progress')"
          - "ON CONFLICT (key) DO NOTHING;"
        steps:
          - {at: "The fix is to let", action: show, target: "1-5"}
          - {at: "Make the key a primary key", action: highlight, target: "2"}
          - {at: "unique constraint", action: note, target: "2", params: {text: "one row per key, enforced by the database", status: ok}}
          - {at: "The first request inserts", action: show, target: "7-9"}
          - {at: "The first request inserts", action: highlight, target: "7-9"}
          - {at: "in progress", action: note, target: "8", params: {text: "the first INSERT wins the key", status: info}}
      # Scene 3: the same race again, now with the constraint.
      - layout: sequence
        from: "The second request tries"
        header: ["THE RACE", "WITH A UNIQUE KEY"]
        actors:
          - {id: r1, label: "request #1", kind: client}
          - {id: db, label: "keys table", kind: store}
          - {id: r2, label: "the retry", kind: client}
        steps:
          - {at: start, action: message, target: "r1->db", params: {text: "INSERT 7f3c"}}
          - {at: start, action: note, target: db, params: {text: "7f3c in progress", status: info}}
          - {at: "tries to insert the same key", action: message, target: "r2->db", params: {text: "INSERT 7f3c", role: retry}}
          - {at: "the database refuses", action: message, target: "db->r2", params: {text: "conflict", role: reply, status: bad}}
          - {at: "It must not charge", action: note, target: r2, params: {text: "no charge", status: ok}}
          - {at: "409 Conflict", action: badge, target: r2, params: {text: "409 RETRY LATER", status: info}}
          - {at: "the first request finishes", action: message, target: "r1->db", params: {text: "UPDATE completed"}}
          - {at: "every later retry", action: message, target: "db->r2", params: {text: "saved 201", role: reply, status: ok}}
          - {at: "gets that response back", action: badge, target: db, params: {text: "ONE WINNER", status: ok}}

  - id: s07
    title: Same key, different request
    narration: >-
      One more trap. What if a buggy client reuses a key for a different payment? Same key, but
      five hundred dollars instead of one hundred. If you blindly replay the stored response, you'll
      tell the client the five-hundred payment succeeded when it never happened. So store a
      fingerprint of the request, a hash of its body, next to the key. On a repeat, compare
      fingerprints. Same fingerprint: replay. Different fingerprint: reject it with a clear error,
      so the bug shows up loudly instead of silently. Here's the replay in Go. When the insert
      finds the key already taken, the handler reads that row: the stored fingerprint, the status,
      and the saved response. Then three cases. The fingerprints differ: the same key came with a
      different request, so answer 422 and stop. The first request is still running: answer 409,
      and the client tries later with the same key. Otherwise the work is done: write back the
      saved status and body, exactly what the first attempt got.
    emphasis: [fingerprint, reject]
    visual:
      - layout: cards
        header: ["SAME KEY", "DIFFERENT REQUEST"]
        title: "one key, two different payments"
        cards:
          - id: first
            title: "request A"
            lines:
              - {id: key, key: key, value: "7f3c"}
              - {id: amount, key: amount, value: "$100"}
              - {id: hash, key: fingerprint, value: "-"}
          - id: second
            title: "request B"
            hidden: true
            lines:
              - {id: key, key: key, value: "7f3c"}
              - {id: amount, key: amount, value: "$500"}
              - {id: hash, key: fingerprint, value: "-"}
        steps:
          - {at: "reuses a key", action: show, target: second}
          - {at: "Same key", action: highlight, target: first.key}
          - {at: "Same key", action: highlight, target: second.key}
          - {at: "five hundred dollars", action: set, target: second.amount, params: {value: "$500", status: bad}}
          - {at: "blindly replay", action: badge, target: second, params: {text: "replayed as paid?", status: bad}}
          - {at: "store a fingerprint", action: set, target: first.hash, params: {value: "9a1f", status: info}}
          - {at: "a hash of its body", action: set, target: second.hash, params: {value: "c04e", status: info}}
          - {at: "compare fingerprints", action: highlight, target: first.hash}
          - {at: "compare fingerprints", action: highlight, target: second.hash}
          - {at: "Same fingerprint", action: mark, target: first, params: {status: ok}}
          - {at: "Same fingerprint", action: badge, target: first, params: {text: REPLAY, status: ok}}
          - {at: "Different fingerprint", action: mark, target: second, params: {status: bad}}
          - {at: "reject it", action: badge, target: second, params: {text: "422 KEY REUSED", status: bad}}
      # Scene 2: the replay in code. Three cases, in the order the handler checks them.
      - layout: code
        from: "Here's the replay"
        header: ["IN CODE", "THE REPLAY"]
        title: idempotency.go
        language: go
        reveal: true
        lines:
          - "// read for this key: storedHash, state, code, body"
          - "switch {"
          - "case !bytes.Equal(storedHash, fingerprint):"
          - '  http.Error(w, "key reuse", http.StatusUnprocessableEntity)'
          - 'case state == "in_progress":'
          - '  http.Error(w, "still running", http.StatusConflict)'
          - "default:"
          - "  w.WriteHeader(int(code.Int64))"
          - "  w.Write(body)"
          - "}"
        steps:
          - {at: "Here's the replay", action: show, target: "1"}
          - {at: "the handler reads that row", action: highlight, target: "1"}
          - {at: "Then three cases", action: show, target: "2"}
          - {at: "The fingerprints differ", action: show, target: "3-4"}
          - {at: "The fingerprints differ", action: highlight, target: "3-4"}
          - {at: "answer 422", action: note, target: "4", params: {text: "422: this key belongs to another request", status: bad}}
          - {at: "still running", action: show, target: "5-6"}
          - {at: "still running", action: highlight, target: "5-6"}
          - {at: "answer 409", action: note, target: "6", params: {text: "409: try later, with the same key", status: info}}
          - {at: "Otherwise the work is done", action: show, target: "7-10"}
          - {at: "Otherwise the work is done", action: highlight, target: "7-9"}
          - {at: "exactly what the first attempt got", action: note, target: "8", params: {text: "the first answer, sent again", status: ok}}

  - id: s08
    title: The chain downstream
    narration: >-
      Now zoom out. Your server rarely moves money itself. It calls a payment gateway. If that
      call times out, you are now the client, facing the same three-case problem. So pass an
      idempotency key downstream too. Many payment providers support one; Stripe, for example,
      documents an Idempotency-Key header. Derive it from your own key, so a retry of your
      operation becomes a retry of theirs, never a new charge. And if the gateway call fails with an
      unknown outcome, don't release the key and try again with a new one. Keep it, and ask the
      gateway what happened. Idempotency isn't a feature of one service. It's a chain, and it only
      holds if every link holds. Here's that link in our Go handler. The key we send the gateway
      is our own key with a prefix, so every retry of this payment sends the gateway the same key.
      If the call fails, we don't know whether the card was charged. So the row stays in progress,
      and the client is told to try later. A background job asks the gateway, with that same key,
      what happened. Only when the gateway answers do we save its answer next to our key.
    emphasis: [downstream, chain, every link]
    visual:
      - layout: console
        phone:
          title: Checkout
          total: "$100.00"
          method: "Visa •••• 4242"
          items: [["Headphones", "$89.00"], ["Shipping", "$11.00"]]
        systems:
          - {id: api, name: "Your server", sub: "POST /v1/payments", idle: "listening on :8080"}
          - {id: gateway, name: "Payment gateway", sub: "POST /v1/charges", idle: "waiting"}
          - {id: bank, name: "Card network", sub: "moves the money"}
        panels:
          - {id: chain, kind: list, title: "the chain · which key each hop carries", unit: links, empty: "No request yet.", lane: api}
          - {id: charges, kind: list, title: "card network · debits", unit: debited, empty: "No money has moved.", lane: bank}
        steps:
          - {at: "Now zoom out", action: screen, target: phone, params: {chip: {label: Idempotency-Key, value: 7f3c-91ab-4e02}}}
          - {at: "Now zoom out", action: tap, target: phone, params: {delay: 0.15}}
          - at: "Now zoom out"
            action: send
            target: "phone->api"
            params:
              delay: 0.25
              label: "POST /payments · key 7f3c"
              wire:
                title: "Create payment"
                method: POST
                path: /v1/payments
                headers: {Content-Type: application/json, Idempotency-Key: 7f3c-91ab-4e02}
                body: {amount: 100, currency: USD, source: card_visa_4242}
          - {at: "Now zoom out", action: item, target: chain, params: {delay: 0.8, text: "client → your server", value: "key 7f3c", status: info}}
          - at: "calls a payment gateway"
            action: send
            target: "api->gateway"
            params:
              label: "charge $100 · no key"
              wire:
                title: "Charge the card"
                tag: "NO KEY"
                bad: true
                method: POST
                path: /v1/charges
                headers: {Content-Type: application/json, Idempotency-Key: null}
                body: {amount: 100, currency: USD, payment: pay_A19}
          - {at: "calls a payment gateway", action: item, target: chain, params: {delay: 0.5, text: "your server → gateway", value: "no key", status: bad}}
          - {at: "calls a payment gateway", action: send, target: "gateway->bank", params: {delay: 0.6, label: "debit $100"}}
          - {at: "calls a payment gateway", action: item, target: charges, params: {delay: 1.1, text: "#1 debit", value: "$100.00"}}
          - {at: "calls a payment gateway", action: log, target: bank, params: {delay: 1.1, text: "debit #1 $100 ok"}}
          - at: "that call times out"
            action: send
            target: "gateway->api"
            params: {label: "200 OK", role: reply, lost: 0.5, response: {status: "200 OK", body: {charge: ch_19, status: succeeded}}}
          - {at: "that call times out", action: log, target: api, params: {delay: 0.7, text: "gateway call timed out"}}
          - {at: "you are now the client", action: highlight, target: api}
          - {at: "you are now the client", action: note, target: wire, params: {text: "Your server is the client now. Same silence, same three stories.", status: bad}}
          - {at: "pass an idempotency key downstream", action: item, target: chain, params: {text: "your server → gateway", value: "key pay-7f3c", status: info}}
          - {at: "pass an idempotency key downstream", action: highlight, target: chain}
          - {at: "Derive it from your own key", action: log, target: api, params: {text: "pay-7f3c = derived from 7f3c"}}
          - at: "a retry of your operation"
            action: send
            target: "api->gateway"
            params:
              label: "RETRY · key pay-7f3c"
              role: retry
              wire:
                title: "Charge the card"
                tag: "RETRY · SAME KEY"
                method: POST
                path: /v1/charges
                headers: {Content-Type: application/json, Idempotency-Key: pay-7f3c}
                body: {amount: 100, currency: USD, payment: pay_A19}
          - {at: "never a new charge", action: log, target: gateway, params: {text: "key pay-7f3c seen → no new debit"}}
          - at: "never a new charge"
            action: send
            target: "gateway->api"
            params: {delay: 0.3, label: "200 · replayed", role: reply, response: {status: "200 OK · replayed", body: {charge: ch_19, status: succeeded}}}
          - {at: "never a new charge", action: stamp, target: charges, params: {delay: 0.5, text: "DEBITED ONCE", status: ok}}
          - {at: "unknown outcome", action: log, target: api, params: {text: "outcome unknown"}}
          - {at: "unknown outcome", action: note, target: wire, params: {text: "Outcome unknown? Keep the key. A new key would be a new charge.", status: bad}}
          - {at: "don't release the key", action: highlight, target: chain}
          - {at: "ask the gateway what happened", action: send, target: "api->gateway", params: {label: "GET charge · key pay-7f3c"}}
          - {at: "Idempotency isn't", action: send, target: "gateway->api", params: {label: "200 · succeeded", role: reply}}
          - {at: "Idempotency isn't", action: log, target: api, params: {delay: 0.5, text: "confirmed: charged once"}}
          - {at: "It's a chain", action: highlight, target: phone}
          - {at: "It's a chain", action: highlight, target: api, params: {delay: 0.15}}
          - {at: "every link holds", action: highlight, target: gateway}
          - {at: "every link holds", action: highlight, target: bank, params: {delay: 0.15}}
          - {at: "every link holds", action: highlight, target: charges, params: {delay: 0.3}}
      # Scene 2: the downstream call in code, and what to do when its outcome is unknown.
      - layout: code
        from: "Here's that link"
        header: ["IN CODE", "THE NEXT LINK"]
        title: idempotency.go
        language: go
        reveal: true
        lines:
          - 'status, resp, err := s.Gateway.Charge(ctx, "pay-"+key, body)'
          - "if err != nil {"
          - "  // Outcome unknown: the row stays in_progress, and a"
          - "  // job asks the gateway, with the same key, what happened."
          - '  http.Error(w, "try later", http.StatusServiceUnavailable)'
          - "  return"
          - "}"
          - "// Charged: save the answer next to the key, then reply."
          - "s.complete(ctx, w, key, status, resp)"
        steps:
          - {at: "Here's that link", action: show, target: "1"}
          - {at: "our own key with a prefix", action: highlight, target: "1"}
          - {at: "our own key with a prefix", action: note, target: "1", params: {text: "pay-7f3c: the same on every retry", status: info}}
          - {at: "If the call fails", action: show, target: "2-7"}
          - {at: "If the call fails", action: highlight, target: "2"}
          - {at: "the row stays in progress", action: highlight, target: "3"}
          - {at: "told to try later", action: highlight, target: "5"}
          - {at: "told to try later", action: note, target: "5", params: {text: "503: the client keeps its key", status: info}}
          - {at: "A background job asks", action: highlight, target: "3-4"}
          - {at: "Only when the gateway answers", action: show, target: "8-9"}
          - {at: "Only when the gateway answers", action: highlight, target: "8-9"}
          - {at: "next to our key", action: note, target: "9", params: {text: "from now on, retries get this answer", status: ok}}

  - id: s09
    title: From production
    narration: >-
      [STORY:duplicate-callback] The night agent replaces this with an anonymised story from the
      owner's story bank (content/stories/), 60–90 seconds, framed as experience. Episode stays in
      draft until then.
    emphasis: []
    visual:              # placeholder until the story is written; this segment is not rendered
      layout: cards
      cards:
        - {id: story, title: "From production", text: "the story goes here"}
      steps:
        - {at: start, action: highlight, target: story}

  - id: s10
    title: The trade-offs
    narration: >-
      This isn't free. Every key is a row you store, so give keys an expiry, long enough to cover
      realistic retries. Stripe, for instance, keeps them for at least twenty-four hours. Clean
      them up after that. You add a database write before every operation, which costs latency.
      You're storing responses to replay them, so think about what's in them. And keys only work
      if clients generate them correctly: once per operation, before the first attempt, reused on
      every retry. Generate a fresh key on each retry and you've built nothing.
    emphasis: [expiry, latency, once per operation]
    visual:
      layout: cards
      header: ["THE TRADE-OFFS", "WHAT IT COSTS"]
      title: "this isn't free"
      cards:
        - id: storage
          title: storage
          text: "every key is a row"
          hidden: true
          lines: [{id: v, key: "keep for", value: "?"}]
        - id: latency
          title: latency
          text: "a write before the work"
          hidden: true
          lines: [{id: v, key: "per request", value: "+1 write"}]
        - id: stored
          title: "saved responses"
          text: "you replay what you kept"
          hidden: true
          lines: [{id: v, key: contents, value: review}]
        - id: client
          title: "the client"
          text: "one key per operation"
          hidden: true
          lines: [{id: v, key: "on a retry", value: "same key"}]
      steps:
        - {at: "Every key is a row", action: show, target: storage}
        - {at: "give keys an expiry", action: set, target: storage.v, params: {value: "a TTL", status: info}}
        - {at: "twenty-four hours", action: set, target: storage.v, params: {value: ">= 24 h", status: ok}}
        - {at: "You add a database write", action: show, target: latency}
        - {at: "costs latency", action: highlight, target: latency.v}
        - {at: "You're storing responses", action: show, target: stored}
        - {at: "what's in them", action: highlight, target: stored.v}
        - {at: "keys only work", action: show, target: client}
        - {at: "reused on every retry", action: mark, target: client, params: {status: ok}}
        - {at: "fresh key on each retry", action: set, target: client.v, params: {value: "new key", status: bad}}
        - {at: "built nothing", action: mark, target: client, params: {status: bad}}
        - {at: "built nothing", action: badge, target: client, params: {text: "BUILT NOTHING", status: bad}}

  - id: s11
    title: Exactly-once, honestly
    narration: >-
      Here's the payoff I promised. You'll see systems advertise exactly-once delivery. Over a real
      network, delivery is at-least-once: messages can and do arrive twice. What you can build is an
      exactly-once effect: at-least-once delivery plus idempotent processing. That's what an
      idempotency key gives you. Not fewer duplicates. Duplicates that don't matter.
    emphasis: [at-least-once, exactly-once effect, don't matter]
    visual:
      # Scene 1: what a real network does to "exactly-once delivery".
      - layout: console
        systems:
          - {id: sender, name: "Sender", sub: "sends each message once, it hopes", idle: "1 message to send"}
          - {id: receiver, name: "Receiver", sub: "applies what arrives", idle: "waiting"}
        panels:
          - {id: applied, kind: list, title: "receiver · effects applied", unit: applied, empty: "Nothing applied yet.", lane: receiver}
        steps:
          - {at: "exactly-once delivery", action: note, target: wire, params: {text: "\"Exactly-once delivery\": the promise on the box."}}
          - at: "Over a real network"
            action: send
            target: "sender->receiver"
            params:
              label: "msg 1"
              wire:
                title: "Deliver a message"
                method: SEND
                path: payments.paid
                headers: {Message-Id: msg-1}
                hi: [Message-Id]
                body: {payment: pay_A19, amount: 100}
          - {at: "Over a real network", action: item, target: applied, params: {delay: 0.55, text: "msg 1", value: "applied"}}
          - {at: "Over a real network", action: log, target: receiver, params: {delay: 0.55, text: "msg 1 applied"}}
          - {at: "Over a real network", action: send, target: "receiver->sender", params: {delay: 0.9, label: "ack", role: reply, lost: 0.5}}
          - {at: "at-least-once", action: log, target: sender, params: {text: "no ack → send again"}}
          - {at: "at-least-once", action: note, target: wire, params: {text: "No ack came back, so the sender sends again. That is at-least-once."}}
          - {at: "arrive twice", action: send, target: "sender->receiver", params: {label: "msg 1 (again)", role: retry}}
          - {at: "arrive twice", action: item, target: applied, params: {delay: 0.55, text: "msg 1", value: "applied again", status: bad}}
          - {at: "arrive twice", action: stamp, target: applied, params: {delay: 0.7, text: "APPLIED TWICE", status: bad}}
      # Scene 2: the sum that does hold.
      - layout: cards
        from: "What you can build"
        header: ["WHAT YOU CAN BUILD", "AN EFFECT, NOT A DELIVERY"]
        joins: ["+", "="]
        cards:
          - {id: delivery, title: "at-least-once", text: "delivery", hidden: true}
          - {id: processing, title: "idempotent", text: "processing", hidden: true}
          - {id: effect, title: "exactly-once", text: "effect"}
        steps:
          - {at: "exactly-once effect", action: highlight, target: effect}
          - {at: "at-least-once delivery plus", action: show, target: delivery}
          - {at: "idempotent processing", action: show, target: processing}
          - {at: "idempotency key gives you", action: mark, target: effect, params: {status: ok}}
          - {at: "Not fewer duplicates", action: apply, target: delivery, params: {role: retry}}
          - {at: "Duplicates that don't matter", action: apply, target: delivery, params: {role: retry}}
          - {at: "Duplicates that don't matter", action: highlight, target: effect}

  - id: s12
    title: Recap and next
    narration: >-
      Recap. Silence after a request has three causes you can't tell apart. Retries are guaranteed.
      So make the operation idempotent: a client-generated key, reused on every retry; a unique
      constraint so the database picks one winner; a request fingerprint to catch misuse; and keys
      passed downstream. Next episode: you've charged the card, and now you need to update your
      database and publish an event, and those two can't share a transaction. That's the outbox
      pattern. See you there.
    emphasis: [one winner, outbox pattern]
    visual:
      # Scene 1: the whole chain, each move lighting up as it is named.
      - layout: console
        phone:
          title: Checkout
          total: "$100.00"
          method: "Visa •••• 4242"
          items: [["Headphones", "$89.00"], ["Shipping", "$11.00"]]
        systems:
          - {id: api, name: "Your server", sub: "POST /v1/payments", idle: "listening on :8080"}
          - {id: store, name: "Key store", sub: "PostgreSQL · idempotency_keys", idle: "waiting"}
          - {id: gateway, name: "Payment gateway", sub: "moves the money"}
        panels:
          - {id: keys, kind: table, title: idempotency_keys, columns: [key, status, fingerprint], unique: key, lane: store}
          - {id: moves, kind: list, title: "idempotency in four moves", unit: moves, empty: "Four things to remember.", lane: api}
        steps:
          - {at: "Silence after a request", action: tap, target: phone}
          - {at: "Silence after a request", action: send, target: "phone->gateway", params: {delay: 0.1, label: "POST /payments"}}
          - {at: "Silence after a request", action: send, target: "gateway->phone", params: {delay: 1.1, label: "201 Created", role: reply, lost: 0.7}}
          - {at: "three causes", action: screen, target: phone, params: {state: error, title: "No response", text: "Three stories. One silence.", attempt: "no reply"}}
          - {at: "Retries are guaranteed", action: tap, target: phone}
          - {at: "Retries are guaranteed", action: send, target: "phone->api", params: {delay: 0.1, label: "RETRY", role: retry}}
          - {at: "a client-generated key", action: screen, target: phone, params: {chip: {label: Idempotency-Key, value: 7f3c-91ab-4e02}}}
          - {at: "a client-generated key", action: item, target: moves, params: {text: "1 · a key from the client", value: "same on every retry", status: info}}
          - {at: "a unique constraint", action: highlight, target: keys.unique}
          - {at: "a unique constraint", action: row, target: keys, params: {delay: 0.2, key: "7f3c-91ab…", cells: [in_progress, "—"], status: info}}
          - {at: "a unique constraint", action: item, target: moves, params: {delay: 0.2, text: "2 · a unique constraint", value: "one winner", status: info}}
          - {at: "one winner", action: row, target: keys, params: {key: "7f3c-91ab…", cells: [completed, "—"], status: ok}}
          - {at: "a request fingerprint", action: row, target: keys, params: {key: "7f3c-91ab…", cells: [completed, "9a1f"], status: ok}}
          - {at: "a request fingerprint", action: item, target: moves, params: {text: "3 · a request fingerprint", value: "catches misuse", status: info}}
          - {at: "keys passed downstream", action: send, target: "api->gateway", params: {label: "charge · key pay-7f3c"}}
          - {at: "keys passed downstream", action: item, target: moves, params: {delay: 0.3, text: "4 · keys passed downstream", value: "the chain holds", status: info}}
      # Scene 2: what the next episode is about.
      - layout: cards
        from: "Next episode"
        header: ["NEXT EPISODE", "002"]
        joins: ["+", "="]
        cards:
          - {id: db, title: "update your database", text: "one transaction"}
          - {id: event, title: "publish an event", text: "another system"}
          - {id: next, title: "The Outbox Pattern", text: "next episode", hidden: true}
        steps:
          - {at: "update your database", action: highlight, target: db}
          - {at: "publish an event", action: highlight, target: event}
          - {at: "can't share a transaction", action: mark, target: db, params: {status: bad}}
          - {at: "can't share a transaction", action: mark, target: event, params: {status: bad}}
          - {at: "the outbox pattern", action: show, target: next}
          - {at: "the outbox pattern", action: mark, target: next, params: {status: ok}}
          - {at: "See you there", action: highlight, target: next}

shorts:
  - id: short-1
    source: standalone
    hook_on_screen: "This retry charged you twice"
    script: >-
      You tapped Pay, got an error, tapped again, and got charged twice. Here's why. When your
      request times out, you can't tell if the server never got it, or charged you and lost the
      reply. A retry in that second case is a second charge. The fix: send an idempotency key, one
      random ID per payment, reused on every retry. The server stores it with a unique constraint,
      so the second attempt can't charge again; it just replays the first response. Same key,
      same result. That's why your retry should be harmless. Unless someone forgot the key.
    visual:
      # Scene 1: the double charge, then the two stories a timeout cannot tell apart.
      - layout: console
        phone:
          title: Checkout
          total: "$100.00"
          method: "Visa •••• 4242"
          items: [["Headphones", "$89.00"], ["Shipping", "$11.00"]]
        systems:
          - {id: api, name: "API server", sub: "POST /v1/payments", idle: "listening on :8080"}
          - {id: gateway, name: "Payment gateway", sub: "moves the money"}
        panels:
          - {id: charges, kind: list, title: "gateway · charges", unit: charged, empty: "No money has moved.", lane: gateway}
          - {id: stories, kind: list, title: "what the phone cannot see", unit: stories, empty: "The phone only knows: no reply.", lane: api}
        steps:
          - {at: "tapped Pay", action: tap, target: phone}
          - at: "tapped Pay"
            action: send
            target: "phone->gateway"
            params:
              delay: 0.1
              label: "POST /payments"
              wire:
                title: "Create payment"
                method: POST
                path: /v1/payments
                headers: {Content-Type: application/json}
                body: {amount: 100, currency: USD, source: card_visa_4242}
          - {at: "tapped Pay", action: log, target: api, params: {delay: 0.55, text: "POST /payments → charge $100"}}
          - {at: "got an error", action: item, target: charges, params: {text: "#1 pay_A19", value: "$100.00", status: ok}}
          - {at: "got an error", action: log, target: gateway, params: {text: "charge #1 $100 ok"}}
          - at: "got an error"
            action: send
            target: "gateway->phone"
            params: {delay: 0.1, label: "201 Created", role: reply, lost: 0.8, response: {status: "201 Created", body: {id: pay_A19, status: succeeded}}}
          - {at: "got an error", action: screen, target: phone, params: {delay: 0.95, state: error, text: "We could not confirm your payment. Try again.", attempt: "no reply"}}
          - {at: "tapped again", action: tap, target: phone}
          - at: "tapped again"
            action: send
            target: "phone->gateway"
            params:
              delay: 0.1
              label: "POST /payments (again)"
              role: retry
              wire:
                title: "Create payment"
                tag: "RETRY"
                method: POST
                path: /v1/payments
                headers: {Content-Type: application/json}
                body: {amount: 100, currency: USD, source: card_visa_4242}
          - {at: "charged twice", action: item, target: charges, params: {text: "#2 pay_B77", value: "$100.00", status: bad}}
          - {at: "charged twice", action: log, target: gateway, params: {text: "charge #2 $100 ok"}}
          - {at: "charged twice", action: stamp, target: charges, params: {delay: 0.15, text: "CHARGED TWICE", status: bad}}
          - at: "charged twice"
            action: send
            target: "gateway->phone"
            params: {delay: 0.1, label: "201 Created", role: reply, response: {status: "201 Created", body: {id: pay_B77, status: succeeded}}}
          - {at: "charged twice", action: screen, target: phone, params: {delay: 0.75, state: success, text: "$100.00 · receipt #B77", warn: "and your bank shows two charges", attempt: "paid"}}
          - {at: "Here's why", action: note, target: wire, params: {text: "The first reply never came back. The phone cannot see which story happened.", status: bad}}
          - {at: "request times out", action: highlight, target: stories}
          - {at: "you can't tell", action: item, target: stories, params: {text: "1 · the request never arrived", value: "nothing charged", status: ok}}
          - {at: "or charged you", action: item, target: stories, params: {text: "2 · charged, the reply got lost", value: "charged once", status: bad}}
          - {at: "A retry", action: highlight, target: stories}
          - {at: "A retry", action: note, target: wire, params: {text: "In story 2, the retry is a second charge.", status: bad}}
          - {at: "second charge", action: highlight, target: charges}
      # Scene 2: the same payment with a key. The retry stops at the server's table.
      - layout: console
        from: "The fix"
        phone:
          title: Checkout
          total: "$100.00"
          method: "Visa •••• 4242"
          items: [["Headphones", "$89.00"], ["Shipping", "$11.00"]]
        systems:
          - {id: api, name: "API server", sub: "POST /v1/payments", idle: "listening on :8080"}
          - {id: store, name: "Key store", sub: "PostgreSQL · idempotency_keys", idle: "waiting"}
          - {id: gateway, name: "Payment gateway", sub: "moves the money"}
        panels:
          - {id: keys, kind: table, title: idempotency_keys, columns: [key, status, response], unique: key, lane: store}
          - {id: charges, kind: list, title: "gateway · charges", unit: charged, empty: "No money has moved.", lane: gateway}
        steps:
          - {at: "idempotency key", action: screen, target: phone, params: {chip: {label: Idempotency-Key, value: 7f3c-91ab-4e02}}}
          - {at: "idempotency key", action: note, target: wire, params: {text: "Before the first attempt, the client makes one random ID for this payment."}}
          - {at: "one random ID", action: tap, target: phone}
          - at: "one random ID"
            action: send
            target: "phone->api"
            params:
              delay: 0.1
              label: "POST /payments · key 7f3c"
              wire:
                title: "Create payment"
                method: POST
                path: /v1/payments
                headers: {Content-Type: application/json, Idempotency-Key: 7f3c-91ab-4e02}
                body: {amount: 100, currency: USD, source: card_visa_4242}
          - {at: "one random ID", action: log, target: api, params: {delay: 0.6, text: "POST /payments key=7f3c"}}
          - {at: "one random ID", action: send, target: "api->store", params: {delay: 0.7, label: "INSERT 7f3c"}}
          - {at: "one random ID", action: row, target: keys, params: {delay: 1.15, key: "7f3c-91ab…", cells: [in_progress, "—"], status: info}}
          - {at: "one random ID", action: log, target: store, params: {delay: 1.15, text: "INSERT 7f3c → 1 row"}}
          - {at: "one random ID", action: send, target: "api->gateway", params: {delay: 1.2, label: "charge $100"}}
          - {at: "reused on every retry", action: item, target: charges, params: {text: "#1 pay_A19", value: "$100.00", status: ok}}
          - {at: "reused on every retry", action: log, target: gateway, params: {text: "charge #1 $100 ok"}}
          - at: "reused on every retry"
            action: send
            target: "gateway->phone"
            params: {delay: 0.1, label: "201 Created", role: reply, lost: 0.8, response: {status: "201 Created", body: {id: pay_A19, status: succeeded}}}
          - {at: "reused on every retry", action: screen, target: phone, params: {delay: 1.1, state: error, text: "We could not confirm your payment. Try again.", attempt: "no reply"}}
          - {at: "The server stores", action: row, target: keys, params: {key: "7f3c-91ab…", cells: [completed, "201 pay_A19"], status: ok}}
          - {at: "The server stores", action: log, target: store, params: {text: "UPDATE 7f3c → completed"}}
          - {at: "The server stores", action: highlight, target: store}
          - {at: "unique constraint", action: highlight, target: keys.unique}
          - {at: "second attempt", action: tap, target: phone}
          - at: "second attempt"
            action: send
            target: "phone->api"
            params:
              delay: 0.1
              label: "RETRY · key 7f3c"
              role: retry
              wire:
                title: "Create payment"
                tag: "RETRY · SAME KEY"
                method: POST
                path: /v1/payments
                headers: {Content-Type: application/json, Idempotency-Key: 7f3c-91ab-4e02}
                body: {amount: 100, currency: USD, source: card_visa_4242}
          - {at: "can't charge again", action: send, target: "api->store", params: {label: "INSERT 7f3c"}}
          - at: "can't charge again"
            action: row
            target: keys
            params: {delay: 0.45, key: "7f3c-91ab…", cells: [completed, "201 pay_A19"], conflict: true, message: "second INSERT of 7f3c → conflict. Key already claimed."}
          - {at: "can't charge again", action: log, target: store, params: {delay: 0.45, text: "INSERT 7f3c → conflict"}}
          - {at: "can't charge again", action: log, target: api, params: {delay: 0.6, text: "key exists → skip charge"}}
          - {at: "replays the first response", action: send, target: "store->api", params: {label: "saved 201", role: reply}}
          - at: "replays the first response"
            action: send
            target: "api->phone"
            params: {delay: 0.5, label: "201 · replayed", role: reply, response: {status: "201 Created · replayed", body: {id: pay_A19, status: succeeded}}}
          - {at: "replays the first response", action: note, target: wire, params: {delay: 1.0, text: "No second charge: the server found key 7f3c and returned what it had saved.", status: ok}}
          - {at: "replays the first response", action: screen, target: phone, params: {delay: 1.05, state: success, text: "$100.00 · receipt #A19", attempt: "paid"}}
          - {at: "Same key", action: stamp, target: charges, params: {text: "CHARGED ONCE", status: ok}}
          - {at: "Same key", action: highlight, target: charges}
          - {at: "your retry", action: tap, target: phone}
          - {at: "your retry", action: send, target: "phone->api", params: {delay: 0.1, label: "RETRY · key 7f3c", role: retry}}
          - {at: "harmless", action: send, target: "api->phone", params: {label: "201 · replayed", role: reply}}
          - {at: "harmless", action: screen, target: phone, params: {delay: 0.55, state: success, text: "$100.00 · receipt #A19", attempt: "paid, same receipt"}}
          - {at: "Unless someone", action: screen, target: phone, params: {state: idle, chip: {label: Idempotency-Key, value: missing, status: bad}}}
          - {at: "Unless someone", action: tap, target: phone, params: {delay: 0.2}}
          - at: "Unless someone"
            action: send
            target: "phone->gateway"
            params:
              delay: 0.3
              label: "POST /payments · no key"
              role: error
              wire:
                title: "Create payment"
                tag: "NO KEY"
                bad: true
                method: POST
                path: /v1/payments
                headers: {Content-Type: application/json, Idempotency-Key: null}
                body: {amount: 100, currency: USD, source: card_visa_4242}
          - {at: "forgot the key", action: item, target: charges, params: {text: "#2 pay_B77", value: "$100.00", status: bad}}
          - {at: "forgot the key", action: stamp, target: charges, params: {delay: 0.1, text: "CHARGED TWICE", status: bad}}
          - {at: "forgot the key", action: screen, target: phone, params: {delay: 0.3, state: success, text: "$100.00 · receipt #B77", warn: "and receipt #A19: charged twice", attempt: "charged again"}}
    youtube_title: "Why Your Retry Charged You Twice #Shorts"
    instagram_caption: |
      Tapped Pay twice and got charged twice? 💸
      The network can't tell "never arrived" from "done, reply lost".
      Idempotency keys make the retry harmless.
      Save this for your next system design interview.
    pillar_hashtags: money-systems
  - id: short-2
    source: segments
    segments: [s06]
    hook_on_screen: "Most tutorials get this wrong"
    youtube_title: "The Idempotency Race Condition #Shorts"
    instagram_caption: |
      Checking "have I seen this key?" isn't enough. Two requests can both pass the check. 🏁
      Let the database pick one winner with a unique constraint.
    pillar_hashtags: money-systems
  - id: short-3
    source: segments
    segments: [s11]
    hook_on_screen: "Exactly-once is a lie"
    youtube_title: "Exactly-Once Delivery Doesn't Exist #Shorts"
    instagram_caption: |
      Networks deliver at-least-once. Always.
      Exactly-once *effect* = at-least-once + idempotent processing.
    pillar_hashtags: distributed-systems
  - id: short-4
    source: segments
    segments: [s02]
    hook_on_screen: "No reply doesn't mean nothing happened"
    youtube_title: "Your Request Timed Out. Did It Work? #Shorts"
    instagram_caption: |
      A timeout has three possible stories — and your client can't tell them apart. ⏱️
      That's why every retry needs to be safe.
    pillar_hashtags: distributed-systems
  - id: short-5
    source: standalone
    hook_on_screen: "Which of these is safe to retry?"
    script: >-
      Quick test. Which of these is safe to retry? GET, PUT, DELETE, POST. HTTP defines the first
      three as idempotent: do them twice and the result is the same as doing them once. Setting
      a value twice changes nothing. Deleting twice still leaves it deleted. POST is the odd one
      out. Create a payment twice and you've created two payments. So when your API takes a POST
      that moves money, you need an idempotency key to make the retry safe. GET, PUT, DELETE
      are safe by design. POST is safe only if you build it that way.
    visual:
      layout: cards
      header: ["QUICK TEST", "SAFE TO RETRY?"]
      title: "which of these is safe to retry?"
      cards:
        - {id: get, title: GET, lines: [{id: v, key: result, value: "?"}]}
        - {id: put, title: PUT, lines: [{id: v, key: value, value: "?"}]}
        - {id: delete, title: DELETE, lines: [{id: v, key: row, value: "?"}]}
        - {id: post, title: POST, lines: [{id: v, key: payments, value: "?"}]}
      steps:
        - {at: "GET, PUT, DELETE, POST", action: highlight, target: get}
        - {at: "PUT, DELETE, POST", action: highlight, target: put}
        - {at: "DELETE, POST", action: highlight, target: delete}
        - {at: "POST. HTTP", action: highlight, target: post}
        - {at: "the first three as idempotent", action: mark, target: get, params: {status: ok}}
        - {at: "the first three as idempotent", action: mark, target: put, params: {status: ok}}
        - {at: "the first three as idempotent", action: mark, target: delete, params: {status: ok}}
        - {at: "do them twice", action: apply, target: get, params: {line: v, value: same, status: ok}}
        - {at: "doing them once", action: apply, target: get, params: {line: v, value: same, status: ok}}
        - {at: "Setting a value twice", action: apply, target: put, params: {line: v, value: "x", status: ok}}
        - {at: "changes nothing", action: apply, target: put, params: {line: v, value: "x", status: ok}}
        - {at: "Deleting twice", action: apply, target: delete, params: {line: v, value: gone, status: ok}}
        - {at: "still leaves it deleted", action: apply, target: delete, params: {line: v, value: gone, status: ok}}
        - {at: "POST is the odd one out", action: highlight, target: post}
        - {at: "Create a payment twice", action: apply, target: post, params: {line: v, value: "1"}}
        - {at: "created two payments", action: apply, target: post, params: {line: v, value: "2", status: bad}}
        - {at: "created two payments", action: mark, target: post, params: {status: bad}}
        - {at: "you need an idempotency key", action: badge, target: post, params: {text: "+ IDEMPOTENCY KEY", status: info}}
        - {at: "GET, PUT, DELETE are safe", action: highlight, target: get}
        - {at: "GET, PUT, DELETE are safe", action: highlight, target: put}
        - {at: "GET, PUT, DELETE are safe", action: highlight, target: delete}
        - {at: "POST is safe only if", action: mark, target: post, params: {status: ok}}
        - {at: "build it that way", action: highlight, target: post}
    youtube_title: "Which HTTP Method Is Safe to Retry? #Shorts"
    instagram_caption: |
      GET ✅ PUT ✅ DELETE ✅ POST ❌
      Only one of these can double-charge your users. Save this for your next API review.
    pillar_hashtags: money-systems

carousel:
  slides:
    - {headline: "Why you got charged twice", body: "And the 1 pattern that stops it"}
    - {headline: "No reply ≠ nothing happened", body: "Never arrived · crashed · done but reply lost"}
    - {headline: "Retries are guaranteed", body: "HTTP clients, meshes, apps, users, queues"}
    - {headline: "Idempotent = twice ≡ once", body: "SET email ✓   balance += 100 ✗"}
    - {headline: "Idempotency-Key header", body: "1 random ID per operation, same on every retry"}
    - {headline: "Let the DB pick a winner", body: "PRIMARY KEY on the key → 2nd insert fails → 409"}
    - {headline: "Fingerprint the request", body: "Same key + different body → reject"}
    - {headline: "Pass it downstream", body: "Your gateway call needs a key too"}
    - {headline: "Exactly-once effect", body: "at-least-once + idempotent processing"}
    - {headline: "Full breakdown on YouTube", body: "Link in bio · Save this post"}

