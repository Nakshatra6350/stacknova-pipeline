          - {at: "silence", action: screen, target: phone, params: {state: error, title: "No response", text: "Story 1, 2 or 3? The client cannot tell."}}
          - {at: "property of networks", action: note, target: wire, params: {text: "Not a bug in your code. A property of networks."}}
          - {at: "a retry means", action: tap, target: phone}
          - at: "a retry means"
