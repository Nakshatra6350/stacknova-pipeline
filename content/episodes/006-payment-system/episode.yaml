  description: |
    A customer taps Pay, the connection drops, and nobody knows if the money moved. Here's how to
    design a payment system at senior level: requirements, idempotency keys scoped per merchant,
    money as integer cents, a payment state machine, timeouts that mean "unknown", signed and
    deduplicated webhooks, an outbox to Kafka, a double-entry ledger and daily reconciliation.
    Four Node.js walkthroughs, and Stripe's own ledger as the story. The capstone of the
    payments series.

