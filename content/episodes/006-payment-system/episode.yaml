fact_check:
  - claim: "Stripe's API takes amounts in the currency's minor unit (cents for USD)"
    source: https://docs.stripe.com/currencies
  - claim: "Stripe saves the result of the first request with an idempotency key and returns it on retries, and refuses a reused key with different parameters"
    source: https://docs.stripe.com/api/idempotent_requests
  - claim: "Webhook events can be delivered more than once and are not guaranteed to arrive in order; Stripe signs each with an HMAC-SHA256 of the timestamp and body in the Stripe-Signature header; return 2xx quickly"
    source: https://docs.stripe.com/webhooks
  - claim: "An authorized card payment must be captured before the authorization expires (usually 7 days for online card payments)"
    source: https://docs.stripe.com/payments/place-a-hold-on-a-payment-method
  - claim: "Handling card data directly can mean more than 300 PCI DSS security controls; low-risk integrations send card data to Stripe without passing through your servers"
    source: https://docs.stripe.com/security/guide
  - claim: "Stripe's Ledger is an immutable log of double-entry records, sees five billion events a day, uses clearing accounts that should return to zero, and verifies 99.99% of dollar volume within four days"
    source: https://stripe.dev/blog/ledger-stripe-system-for-tracking-and-validating-money-movement
  - claim: "A single INSERT ... SELECT is atomic; ON CONFLICT DO NOTHING inserts no row when the unique key exists"
    source: https://www.postgresql.org/docs/current/sql-insert.html
  - claim: "10 million payments a day is about 116 a second on average; a conditional UPDATE lets only one of two workers move a payment"
    source: "derived from arithmetic and code sample samples/node/payments.mjs"

