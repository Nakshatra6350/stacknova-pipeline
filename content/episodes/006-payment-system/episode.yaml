localizations:
  hi:
    title: "Payment System डिज़ाइन करें (Senior System Design Interview)"
    description: "ग्राहक Pay दबाता है, कनेक्शन टूट जाता है, और कोई नहीं जानता कि पैसा कटा या नहीं। Senior स्तर पर payment system का डिज़ाइन: merchant के हिसाब से idempotency keys, पैसे को पूरे cents में रखना, payment state machine, timeout का मतलब 'अज्ञात', signed और deduplicated webhooks, Kafka तक outbox, double-entry ledger और रोज़ का reconciliation — Node.js कोड के साथ।"
  es:
    title: "Diseña un sistema de pagos (entrevista senior de system design)"
    description: "El cliente pulsa Pagar, la conexión se corta y nadie sabe si el dinero se movió. Cómo diseñar un sistema de pagos a nivel senior: claves de idempotencia por comercio, dinero en centavos enteros, una máquina de estados, timeouts que significan «desconocido», webhooks firmados y sin duplicados, outbox hacia Kafka, un ledger de partida doble y conciliación diaria. Con Node.js."
  pt:
    title: "Projete um sistema de pagamentos (entrevista sênior de system design)"
    description: "O cliente toca em Pagar, a conexão cai e ninguém sabe se o dinheiro foi movido. Como projetar um sistema de pagamentos em nível sênior: chaves de idempotência por lojista, dinheiro em centavos inteiros, uma máquina de estados, timeouts que significam «desconhecido», webhooks assinados e sem duplicatas, outbox para o Kafka, um ledger de partidas dobradas e conciliação diária. Em Node.js."
  id:
    title: "Desain Sistem Pembayaran (Wawancara System Design Senior)"
    description: "Pelanggan menekan Bayar, koneksi terputus, dan tak ada yang tahu apakah uangnya berpindah. Cara mendesain sistem pembayaran di level senior: kunci idempotensi per merchant, uang dalam sen bulat, state machine pembayaran, timeout yang berarti «tidak diketahui», webhook bertanda tangan tanpa duplikat, outbox ke Kafka, ledger double-entry, dan rekonsiliasi harian. Dengan Node.js."
  vi:
    title: "Thiết kế hệ thống thanh toán (phỏng vấn System Design cấp senior)"
    description: "Khách hàng bấm Thanh toán, kết nối bị ngắt, và không ai biết tiền đã đi hay chưa. Cách thiết kế hệ thống thanh toán ở cấp senior: idempotency key theo từng merchant, tiền lưu bằng số cent nguyên, máy trạng thái thanh toán, timeout nghĩa là «chưa biết», webhook có chữ ký và chống trùng, outbox sang Kafka, sổ cái kép và đối soát hằng ngày. Bằng Node.js."
  ar:
    title: "صمّم نظام مدفوعات (مقابلة تصميم أنظمة للمستوى المتقدم)"
    description: "يضغط العميل على «ادفع»، فينقطع الاتصال، ولا يعرف أحد هل انتقل المال أم لا. كيف تصمّم نظام مدفوعات على مستوى متقدم: مفاتيح منع التكرار لكل تاجر، والمبالغ بالسنتات الصحيحة، وآلة حالات للدفعة، ومهلة تعني «غير معروف»، وwebhooks موقّعة بلا تكرار، وoutbox إلى Kafka، ودفتر قيد مزدوج، ومطابقة يومية. بلغة Node.js."

