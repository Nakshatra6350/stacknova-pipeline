[project]
name = "channel-os"
version = "0.1.0"
description = "Automation pipeline behind the StackNova channel"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0.12",
]
# Heavy and only needed to synthesise speech: `uv sync --group voice`. Tests never import it.
voice = [
    "chatterbox-tts==0.1.7",
    # Named here only so the CPU-only index below applies; chatterbox pins these versions.
    "torch==2.6.0",
    "torchaudio==2.6.0",
    # chatterbox's watermarker (resemble-perth 1.0.1) imports pkg_resources, gone in setuptools 81.
    "setuptools<81",
]

[tool.uv]
default-groups = ["dev"]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/channel_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "brand-assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["chatterbox.*", "torch", "perth"]
ignore_missing_imports = true
